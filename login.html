<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول — VOTERA</title>

  <style>
    :root {
      --primary: #6c5ce7;
      --primary-dark: #5848d6;
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #17171c;
      --muted: #777783;
      --border: #e8e8ef;
      --danger: #e74c3c;
      --success: #159957;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      height: 68px;
      background: rgba(255,255,255,.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
    }

    .nav {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 0 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      text-decoration: none;
      color: var(--text);
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--primary);
    }

    .home {
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .container {
      width: 100%;
      max-width: 450px;
      margin: auto;
      padding: 55px 18px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: #ece9ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,.04);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #f1f1f6;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab {
      border: none;
      background: transparent;
      padding: 12px;
      border-radius: 9px;
      font-weight: 800;
      cursor: pointer;
      color: var(--muted);
    }

    .tab.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 800;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      background: #fafafd;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: var(--primary);
      background: white;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-left: 45px;
    }

    .show-password {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
    }

    .submit {
      width: 100%;
      padding: 15px;
      margin-top: 5px;
      border: none;
      border-radius: 13px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      transition: .2s;
    }

    .submit:hover {
      background: var(--primary-dark);
    }

    .submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .message.error {
      display: block;
      background: #fff0ee;
      color: var(--danger);
    }

    .message.success {
      display: block;
      background: #edfff5;
      color: var(--success);
    }

    .switch-text {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 18px;
    }

    .switch-text button {
      border: none;
      background: transparent;
      color: var(--primary);
      font-weight: 900;
      cursor: pointer;
    }

    .note {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
      margin-top: 18px;
    }

    .profile-field {
      display: none;
    }

    @media (max-width: 500px) {
      .container {
        padding-top: 35px;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>

  <nav class="nav">

    <a href="index.html" class="logo">
      VOTE<span>RA</span>
    </a>

    <a href="index.html" class="home">
      الرئيسية ←
    </a>

  </nav>

</header>


<main class="container">

  <section class="header">

    <div class="icon">
      👤
    </div>

    <h1 id="pageTitle">
      مرحبًا بك في VOTERA
    </h1>

    <p id="pageDescription">
      سجّل دخولك وابدأ التصويت وإنشاء التصويتات.
    </p>

  </section>


  <section class="card">

    <div class="tabs">

      <button
        type="button"
        class="tab active"
        id="loginTab"
        onclick="showLogin()"
      >
        تسجيل الدخول
      </button>

      <button
        type="button"
        class="tab"
        id="signupTab"
        onclick="showSignup()"
      >
        إنشاء حساب
      </button>

    </div>


    <div id="message" class="message"></div>


    <form id="authForm">

      <div
        class="form-group profile-field"
        id="usernameGroup"
      >

        <label for="username">
          اسم المستخدم
        </label>

        <input
          type="text"
          id="username"
          placeholder="مثال: ayoub123"
          maxlength="30"
          autocomplete="username"
        >

      </div>


      <div
        class="form-group profile-field"
        id="displayNameGroup"
      >

        <label for="displayName">
          الاسم الظاهر
        </label>

        <input
          type="text"
          id="displayName"
          placeholder="مثال: Ayoub"
          maxlength="50"
        >

      </div>


      <div class="form-group">

        <label for="email">
          البريد الإلكتروني
        </label>

        <input
          type="email"
          id="email"
          placeholder="example@email.com"
          autocomplete="email"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          كلمة المرور
        </label>

        <div class="password-wrapper">

          <input
            type="password"
            id="password"
            placeholder="6 أحرف على الأقل"
            minlength="6"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
          >
            👁️
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="submit"
        id="submitButton"
      >
        تسجيل الدخول
      </button>

    </form>


    <div class="switch-text" id="switchText">

      ليس لديك حساب؟

      <button
        type="button"
        onclick="showSignup()"
      >
        إنشاء حساب
      </button>

    </div>

  </section>


  <div class="note">
    باستخدام VOTERA أنت توافق على شروط الاستخدام وإرشادات المجتمع.
  </div>

</main>


<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
  "https://vatlwkuagxyrvwclttfz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_7zlCZUTtFzvs_Ytv5XnvEg_y6tOWY94";


/* =================================
   MODE
================================= */

let mode = "login";


/* =================================
   ELEMENTS
================================= */

const form =
  document.getElementById("authForm");

const submitButton =
  document.getElementById("submitButton");

const message =
  document.getElementById("message");

const usernameGroup =
  document.getElementById("usernameGroup");

const displayNameGroup =
  document.getElementById("displayNameGroup");

const loginTab =
  document.getElementById("loginTab");

const signupTab =
  document.getElementById("signupTab");

const pageTitle =
  document.getElementById("pageTitle");

const pageDescription =
  document.getElementById("pageDescription");

const switchText =
  document.getElementById("switchText");


/* =================================
   LOGIN MODE
================================= */

function showLogin() {

  mode = "login";

  loginTab.classList.add("active");
  signupTab.classList.remove("active");

  usernameGroup.style.display = "none";
  displayNameGroup.style.display = "none";

  pageTitle.textContent =
    "مرحبًا بك في VOTERA";

  pageDescription.textContent =
    "سجّل دخولك وابدأ التصويت وإنشاء التصويتات.";

  submitButton.textContent =
    "تسجيل الدخول";

  switchText.innerHTML =
    `
      ليس لديك حساب؟
      <button
        type="button"
        onclick="showSignup()"
      >
        إنشاء حساب
      </button>
    `;

  clearMessage();

}


/* =================================
   SIGNUP MODE
================================= */

function showSignup() {

  mode = "signup";

  signupTab.classList.add("active");
  loginTab.classList.remove("active");

  usernameGroup.style.display = "block";
  displayNameGroup.style.display = "block";

  pageTitle.textContent =
    "إنشاء حساب في VOTERA";

  pageDescription.textContent =
    "أنشئ حسابك وابدأ ببناء مجتمعك.";

  submitButton.textContent =
    "إنشاء الحساب";

  switchText.innerHTML =
    `
      لديك حساب بالفعل؟
      <button
        type="button"
        onclick="showLogin()"
      >
        تسجيل الدخول
      </button>
    `;

  clearMessage();

}


/* =================================
   PASSWORD
================================= */

function togglePassword() {

  const password =
    document.getElementById("password");

  if (password.type === "password") {

    password.type = "text";

  } else {

    password.type = "password";

  }

}


/* =================================
   MESSAGE
================================= */

function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

}

function clearMessage() {

  message.textContent = "";

  message.className =
    "message";

}


/* =================================
   AUTH
================================= */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    clearMessage();

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;

    if (!email || !password) {

      showMessage(
        "يرجى إدخال البريد الإلكتروني وكلمة المرور.",
        "error"
      );

      return;

    }


    submitButton.disabled = true;

    submitButton.textContent =
      mode === "login"
      ? "جاري تسجيل الدخول..."
      : "جاري إنشاء الحساب...";


    try {

      if (mode === "login") {

        await loginUser(
          email,
          password
        );

      } else {

        await signupUser(
          email,
          password
        );

      }

    }

    catch(error) {

      console.error(error);

      showMessage(
        getArabicError(error),
        "error"
      );

      submitButton.disabled = false;

      submitButton.textContent =
        mode === "login"
        ? "تسجيل الدخول"
        : "إنشاء الحساب";

    }

  }
);


/* =================================
   LOGIN USER
================================= */

async function loginUser(
  email,
  password
) {

  const response =
    await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",
      {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_KEY

        },

        body: JSON.stringify({

          email: email,

          password: password

        })

      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(
      data.error_description ||
      data.msg ||
      data.message ||
      "فشل تسجيل الدخول."
    );

  }


  saveSession(data);

  showMessage(
    "تم تسجيل الدخول بنجاح! جاري الانتقال...",
    "success"
  );


  setTimeout(
    function() {

      window.location.href =
        "index.html";

    },
    800
  );

}


/* =================================
   SIGNUP USER
================================= */

async function signupUser(
  email,
  password
) {

  const username =
    document
      .getElementById("username")
      .value
      .trim()
      .toLowerCase();

  const displayName =
    document
      .getElementById("displayName")
      .value
      .trim();


  if (!username) {

    throw new Error(
      "يرجى اختيار اسم مستخدم."
    );

  }


  if (!/^[a-z0-9_]+$/.test(username)) {

    throw new Error(
      "اسم المستخدم يجب أن يحتوي على أحرف إنجليزية وأرقام و _ فقط."
    );

  }


  if (password.length < 6) {

    throw new Error(
      "كلمة المرور يجب أن تحتوي على 6 أحرف على الأقل."
    );

  }


  /* Create account */

  const response =
    await fetch(
      SUPABASE_URL +
      "/auth/v1/signup",
      {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_KEY

        },

        body: JSON.stringify({

          email: email,

          password: password,

          data: {

            username: username,

            display_name:
              displayName || username

          }

        })

      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(
      data.msg ||
      data.message ||
      data.error_description ||
      "فشل إنشاء الحساب."
    );

  }


  /*
    If email confirmation is enabled,
    Supabase may not return a session.
  */

  if (
    data.access_token &&
    data.user
  ) {

    saveSession(data);

    showMessage(
      "تم إنشاء الحساب بنجاح! جاري الانتقال...",
      "success"
    );


    setTimeout(
      function() {

        window.location.href =
          "index.html";

      },
      800
    );

  } else {

    showMessage(
      "تم إنشاء الحساب! تحقق من بريدك الإلكتروني لتأكيد الحساب.",
      "success"
    );

    submitButton.disabled = false;

    submitButton.textContent =
      "إنشاء الحساب";

  }

}


/* =================================
   SAVE SESSION
================================= */

function saveSession(data) {

  localStorage.setItem(
    "votera_access_token",
    data.access_token || ""
  );

  localStorage.setItem(
    "votera_refresh_token",
    data.refresh_token || ""
  );

  localStorage.setItem(
    "votera_user",
    JSON.stringify(
      data.user || {}
    )
  );

}


/* =================================
   ARABIC ERRORS
================================= */

function getArabicError(error) {

  const text =
    String(error.message || error);


  if (
    text.toLowerCase()
      .includes("invalid login credentials")
  ) {

    return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

  }


  if (
    text.toLowerCase()
      .includes("user already registered")
  ) {

    return "هذا البريد الإلكتروني مستخدم بالفعل.";

  }


  if (
    text.toLowerCase()
      .includes("email not confirmed")
  ) {

    return "يجب تأكيد بريدك الإلكتروني أولًا.";

  }


  if (
    text.toLowerCase()
      .includes("password")
  ) {

    return "كلمة المرور غير صحيحة أو قصيرة جدًا.";

  }


  if (
    text.toLowerCase()
      .includes("username")
  ) {

    return "اسم المستخدم غير متاح أو مستخدم بالفعل.";

  }


  return text || "حدث خطأ غير معروف.";

}


/* =================================
   CHECK EXISTING SESSION
================================= */

const existingToken =
  localStorage.getItem(
    "votera_access_token"
  );


if (existingToken) {

  showMessage(
    "أنت مسجل الدخول بالفعل.",
    "success"
  );

}

</script>

</body>
</html>
