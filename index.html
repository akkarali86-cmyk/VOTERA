<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<meta name="description" content="VOTERA — Ask. Vote. Discover. Create and share viral polls and battles.">
<meta property="og:title" content="VOTERA — Ask. Vote. Discover.">
<meta property="og:description" content="Create a question. Let the world decide.">
<meta property="og:type" content="website">
<title>VOTERA — Ask. Vote. Discover.</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--text:#11121a;--muted:#6d7080;--line:#e8e8ef;--accent:#7357ff;--accent2:#ff4f8b;--soft:#f0edff;--shadow:0 12px 35px rgba(25,20,60,.08);--radius:22px}
[data-theme=dark]{--bg:#0b0b12;--card:#15151f;--text:#f8f8ff;--muted:#a6a6b5;--line:#292936;--soft:#211d38;--shadow:0 14px 40px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topin{max-width:1120px;margin:auto;height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{font-weight:950;letter-spacing:-1.5px;font-size:24px;cursor:pointer}.brand span{color:var(--accent)}.desktop-nav{display:flex;gap:5px}.navbtn,.iconbtn{background:transparent;color:var(--muted);padding:10px 13px;border-radius:13px;font-weight:700}.navbtn:hover,.iconbtn:hover{background:var(--soft);color:var(--text)}.actions{display:flex;gap:6px;align-items:center}.hero{max-width:1120px;margin:auto;padding:68px 18px 35px}.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center}.eyebrow{display:inline-flex;background:var(--soft);color:var(--accent);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:800}.hero h1{font-size:clamp(48px,8vw,92px);line-height:.9;letter-spacing:-5px;margin:18px 0}.hero h1 span{color:var(--accent)}.tag{font-size:clamp(20px,3vw,28px);font-weight:850}.hero p{color:var(--muted);font-size:17px;line-height:1.6;max-width:620px}.btn{padding:13px 18px;border-radius:15px;font-weight:850;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{transform:translateY(-2px)}.primary{background:var(--accent);color:#fff;box-shadow:0 10px 24px rgba(115,87,255,.25)}.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}.hero-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.hero-art{min-height:360px;border-radius:34px;background:linear-gradient(145deg,var(--accent),#9d77ff 45%,var(--accent2));padding:18px;box-shadow:var(--shadow);transform:rotate(2deg)}.mock{height:100%;border-radius:26px;background:#11111a;padding:16px;color:white;display:flex;flex-direction:column;justify-content:center;gap:12px}.mock-card{background:#20202d;border-radius:18px;padding:15px}.mock-img{height:100px;border-radius:14px;background:linear-gradient(135deg,#ffb36b,#ff4f8b)}.mock-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section{max-width:1120px;margin:auto;padding:25px 18px 90px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}.section h2{margin:0;font-size:27px;letter-spacing:-1px}.muted{color:var(--muted)}.chips{display:flex;gap:8px;overflow:auto;padding:3px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--text);padding:9px 13px;border-radius:999px;font-weight:750}.chip.active{background:var(--text);color:var(--bg)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.poll{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);overflow:hidden}.poll h3{margin:11px 0 7px;font-size:18px}.poll-img{height:190px;border-radius:16px;object-fit:cover;width:100%;background:linear-gradient(135deg,var(--soft),#ddd)}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.opt{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--bg);min-height:75px;padding:9px;text-align:left}.opt img{width:100%;height:90px;object-fit:cover;border-radius:10px;margin-bottom:7px}.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:10px}.share{background:var(--soft);color:var(--accent);padding:8px 10px;border-radius:10px;font-weight:800}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;grid-column:1/-1}.page{max-width:900px;margin:auto;padding:35px 18px 100px}.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}.form label{display:block;font-weight:800;margin:16px 0 7px}.input,.textarea,.select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px;outline:none}.input:focus,.textarea:focus,.select:focus{border-color:var(--accent)}.textarea{min-height:105px;resize:vertical}.option-editor{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-radius:17px;margin:10px 0}.upload{height:100%;min-height:120px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;color:var(--accent);font-weight:800}.upload img{width:100%;height:100%;object-fit:cover}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toggle{padding:13px;border:1px solid var(--line);border-radius:14px;display:flex;justify-content:space-between;align-items:center;background:var(--bg)}.switch{width:44px;height:24px;background:var(--line);border-radius:20px;position:relative}.switch:after{content:"";position:absolute;width:18px;height:18px;top:3px;left:3px;background:white;border-radius:50%;transition:.2s}.switch.on{background:var(--accent)}.switch.on:after{left:23px}.vote-options{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.vote-option{border:2px solid var(--line);border-radius:22px;background:var(--card);overflow:hidden;text-align:left;transition:.2s}.vote-option:hover{transform:translateY(-3px);border-color:var(--accent)}.vote-option img{width:100%;height:270px;object-fit:cover}.vote-option .body{padding:15px}.vs{text-align:center;font-size:13px;font-weight:950;color:var(--accent);margin:-6px 0}.result{margin-top:16px}.resultrow{margin:15px 0}.resultline{display:flex;justify-content:space-between;font-weight:850}.result .bar{height:12px}.big-result{text-align:center;padding:18px;background:var(--soft);border-radius:18px}.big-result strong{font-size:42px}.sharebox{display:flex;gap:8px;flex-wrap:wrap}.sharebox .btn{flex:1;min-width:110px}.profile-head{display:flex;gap:18px;align-items:center}.avatar{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:28px;font-weight:950}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:15px;text-align:center}.stat strong{display:block;font-size:22px}.leader{display:flex;align-items:center;gap:12px;padding:13px;border-bottom:1px solid var(--line)}.rank{font-weight:950;width:28px}.level{font-size:12px;color:var(--accent);font-weight:900}.bottom{display:none}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:#11111a;color:#fff;padding:12px 16px;border-radius:13px;z-index:99;transition:.25s;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none;align-items:end;justify-content:center;padding:12px}.modal-bg.show{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:25px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.hidden{display:none!important}.search{position:relative}.search input{padding-left:40px}.search span{position:absolute;left:13px;top:12px}.footer{text-align:center;color:var(--muted);padding:30px 18px 90px;font-size:13px}
@media(max-width:800px){.desktop-nav{display:none}.hero{padding-top:40px}.hero-grid{grid-template-columns:1fr}.hero-art{min-height:290px}.grid{grid-template-columns:1fr 1fr}.poll-img{height:150px}.vote-option img{height:200px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.bottom button{background:transparent;color:var(--muted);font-size:11px;font-weight:800}.bottom button b{display:block;font-size:19px;margin-bottom:2px}.bottom button.active{color:var(--accent)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.hero h1{letter-spacing:-3px}.hero-art{display:none}.settings{grid-template-columns:1fr}.option-editor{grid-template-columns:90px 1fr}.stats{grid-template-columns:1fr 1fr}.vote-options{grid-template-columns:1fr}.section{padding-bottom:80px}.panel{padding:15px}.topin{padding:0 13px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="topin">
<div class="brand" onclick="go('home')">VOTE<span>RA</span></div>
<nav class="desktop-nav">
<button class="navbtn" onclick="go('home')">Home</button><button class="navbtn" onclick="go('explore')">Explore</button><button class="navbtn" onclick="go('create')">Create Vote</button><button class="navbtn" onclick="go('leaderboard')">Leaderboard</button><button class="navbtn" onclick="go('profile')">Profile</button>
</nav>
<div class="actions"><button class="iconbtn" onclick="toggleTheme()" aria-label="theme">◐</button></div>
</div></header>
<main id="app"></main>
<nav class="bottom">
<button data-nav="home" onclick="go('home')"><b>🏠</b>Home</button>
<button data-nav="explore" onclick="go('explore')"><b>🔥</b>Explore</button>
<button data-nav="create" onclick="go('create')"><b>＋</b>Create</button>
<button data-nav="leaderboard" onclick="go('leaderboard')"><b>🏆</b>Rank</button>
<button data-nav="profile" onclick="go('profile')"><b>👤</b>Profile</button>
</nav>
<div id="toast" class="toast"></div>
<div id="modal" class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalContent"></div></div>
</div>
<script>
const KEY='votera_state_v1';
const sample=[
{id:'7x82',q:'Which logo should I choose?',cat:'💼 Business',votes:2438,opts:[{name:'Aurora',desc:'Clean and modern',img:'https://images.unsplash.com/photo-1557682250-33bd709cbe85?auto=format&fit=crop&w=800&q=80'},{name:'Nova',desc:'Bold and energetic',img:'https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=800&q=80'}]},
{id:'k91p',q:'Which outfit looks better?',cat:'👗 Fashion',votes:1821,opts:[{name:'A — Street',desc:'Casual look',img:'https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=800&q=80'},{name:'B — Classic',desc:'Smart look',img:'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=800&q=80'}]},
{id:'m4g2',q:'Which phone would you pick?',cat:'📱 Technology',votes:1104,opts:[{name:'Option A',desc:'Performance',img:'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=800&q=80'},{name:'Option B',desc:'Camera',img:'https://images.unsplash.com/photo-1598327105666-5b89351aff97?auto=format&fit=crop&w=800&q=80'}]},
{id:'f8q3',q:'Who wins this gaming battle?',cat:'🎮 Gaming',votes:876,opts:[{name:'Player A',desc:'Speed',img:'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80'},{name:'Player B',desc:'Strategy',img:'https://images.unsplash.com/photo-1560419015-7c427e8ae5ba?auto=format&fit=crop&w=800&q=80'}]}
];
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{votes:sample,created:0,received:0,xp:120,voted:{},views:{},comments:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function go(page,id){location.hash=page+(id?'/'+id:'');render()}
function current(){let [p,id]=(location.hash.slice(1)||'home').split('/');return {p,id}}
function toggleTheme(){let d=document.documentElement;let x=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=x;localStorage.setItem('votera_theme',x)}
document.documentElement.dataset.theme=localStorage.getItem('votera_theme')||'light';

function level(){let x=state.xp;return x>=5000?'👑 Vote Master':x>=2500?'💎 Trend Maker':x>=1000?'🥇 Influencer':x>=400?'🥈 Voter':'🥉 Beginner'}
function card(v){let total=v.votes||0;let voted=state.voted[v.id];let pct=v.percent||Math.round(50+Math.random()*18);return `<article class="poll">
<img class="poll-img" src="${esc(v.opts[0].img||'')}" alt="">
<h3>${esc(v.q)}</h3><div class="muted">${esc(v.cat||'🔥 Trending')}</div>
<div class="opts">${v.opts.slice(0,2).map((o,i)=>`<div class="opt" onclick="go('vote','${v.id}')"><img src="${esc(o.img||'')}" alt=""><b>${esc(o.name||'Option '+String.fromCharCode(65+i))}</b>${voted?`<div class="bar"><i style="width:${i?100-pct:pct}%"></i></div>`:''}</div>`).join('')}</div>
<div class="meta"><span>🗳️ ${total.toLocaleString()} votes</span><button class="share" onclick="event.stopPropagation();shareVote('${v.id}')">↗ Share</button></div></article>`}
function home(){
return `<section class="hero"><div class="hero-grid"><div><span class="eyebrow">🔥 Built for viral decisions</span><h1>VOTE<span>RA</span></h1><div class="tag">Ask. Vote. Discover.</div><p>Create a question. Let the world decide. Compare ideas, photos, designs, products and more — then share your vote with everyone.</p><div class="hero-buttons"><button class="btn primary" onclick="go('create')">🔥 Create a Vote</button><button class="btn secondary" onclick="go('explore')">Explore Votes</button></div></div><div class="hero-art"><div class="mock"><div class="muted">VOTERA BATTLE</div><div class="mock-card"><b>Which design wins?</b><div class="mock-row" style="margin-top:10px"><div class="mock-img"></div><div class="mock-img" style="background:linear-gradient(135deg,#7a5cff,#42d9c8)"></div></div></div><div class="mock-card">🔥 2,438 people voted</div></div></div></div></section>
<section class="section"><div class="section-head"><h2>🔥 Trending Votes</h2><button class="navbtn" onclick="go('explore')">See all →</button></div><div class="chips">${cats().map((c,i)=>`<button class="chip ${i===0?'active':''}" onclick="filterExplore('${esc(c)}')">${c}</button>`).join('')}</div><div class="grid">${state.votes.slice(0,6).map(card).join('')}</div></section>
<footer class="footer">VOTERA · Ask. Vote. Discover.<br>Respect people. Vote responsibly. · Terms · Privacy</footer>`;
}
function cats(){return ['🔥 Trending','🆕 New','🎮 Gaming','👗 Fashion','🍔 Food','📱 Technology','⚽ Sports','🎬 Movies','🎵 Music','😂 Fun','💼 Business','❤️ Relationships']}
function explore(){
let q=window.exploreQuery||'';let cat=window.exploreCat||'🔥 Trending';
let list=state.votes.filter(v=>(!q||v.q.toLowerCase().includes(q.toLowerCase())||String(v.cat).toLowerCase().includes(q.toLowerCase()))&&(cat==='🔥 Trending'||cat==='🆕 New'||!cat||v.cat===cat));
return `<section class="page"><div class="section-head"><div><h2>Explore</h2><div class="muted">Discover what people are voting on.</div></div><button class="btn primary" onclick="go('create')">＋ Create</button></div>
<div class="search"><span>🔎</span><input class="input" placeholder="Search votes..." value="${esc(q)}" oninput="window.exploreQuery=this.value;render()"></div>
<div class="chips" style="margin-top:12px">${cats().map(c=>`<button class="chip ${cat===c?'active':''}" onclick="filterExplore('${esc(c)}')">${c}</button>`).join('')}</div>
<div class="section-head" style="margin-top:15px"><h2>${cat}</h2></div><div class="grid">${list.length?list.map(card).join(''):'<div class="empty">No votes found. Create the first one 🚀</div>'}</div></section>`;
}
function filterExplore(c){window.exploreCat=c;go('explore')}
function create(){
let opts=[0,1].map(i=>optionEditor(i)).join('');
return `<section class="page"><div class="section-head"><div><h2>Create a Vote</h2><div class="muted">Turn any decision into a shareable vote.</div></div></div>
<div class="panel form"><label>Question</label><textarea id="question" class="textarea" maxlength="180" placeholder="Which logo should I use?"></textarea>
<div id="optionEditors">${opts}</div><button class="btn secondary" id="addOption" onclick="addOption()">＋ Add option</button>
<label>Category</label><select id="category" class="select">${cats().slice(1).map(c=>`<option>${c}</option>`).join('')}</select>
<label>Settings</label><div class="settings">
${toggle('public','Public vote',true)}${toggle('comments','Allow comments',true)}${toggle('one','One vote per user',true)}${toggle('duration','Voting duration',false)}
</div><div style="margin-top:18px"><button class="btn primary" onclick="publishVote()">🚀 Publish Vote</button></div></div></section>`;
}
function optionEditor(i){return `<div class="option-editor"><label class="upload" for="file${i}" id="preview${i}">🖼️<br>Upload<input id="file${i}" type="file" accept="image/*" hidden onchange="previewImage(this,${i})"></label><div><input id="name${i}" class="input" placeholder="Option ${String.fromCharCode(65+i)}"><textarea id="desc${i}" class="textarea" style="margin-top:8px;min-height:65px" placeholder="Short description"></textarea></div></div>`}
function toggle(id,label,on){return `<div class="toggle"><span>${label}</span><span class="switch ${on?'on':''}" data-toggle="${id}" onclick="this.classList.toggle('on')"></span></div>`}
let optCount=2,imgs={};
function addOption(){if(optCount>=4)return toast('Maximum 4 options');document.getElementById('optionEditors').insertAdjacentHTML('beforeend',optionEditor(optCount));optCount++}
function previewImage(input,i){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{imgs[i]=e.target.result;document.getElementById('preview'+i).innerHTML=`<img src="${e.target.result}">`};r.readAsDataURL(f)}
function publishVote(){
let q=document.getElementById('question').value.trim();if(q.length<5)return toast('Write a longer question');
let opts=[];for(let i=0;i<optCount;i++){let n=document.getElementById('name'+i)?.value.trim();if(n)opts.push({name:n,desc:document.getElementById('desc'+i)?.value.trim()||'',img:imgs[i]||fallback(i)})}
if(opts.length<2)return toast('Add at least 2 options');
let id=Math.random().toString(36).slice(2,6)+Math.random().toString(36).slice(2,4);
let v={id,q,cat:document.getElementById('category').value,votes:0,opts,created:Date.now(),percent:50};
state.votes.unshift(v);state.created++;state.xp+=100;save();go('vote',id);toast('Vote published 🚀')
}
function fallback(i){let a=['7357ff','ff4f8b','42d9c8','ffb84d'][i%4];return `https://dummyimage.com/900x600/${a}/ffffff&text=OPTION+${String.fromCharCode(65+i)}`}
function votePage(id){
let v=state.votes.find(x=>x.id===id);if(!v)return `<section class="page"><div class="empty">Vote not found.</div></section>`;
let did=state.voted[id];let totals=v.votes||0;let percentages=v.percentages||v.opts.map((_,i)=>i===0?68:Math.round(32/(v.opts.length-1)));
if(!did) percentages=v.opts.map(()=>Math.round(100/v.opts.length));
state.views[id]=(state.views[id]||0)+1;save();
return `<section class="page"><div class="panel"><div class="muted">${esc(v.cat||'🔥 Trending')} · VOTERA</div><h2 style="font-size:clamp(28px,6vw,48px);margin:8px 0">${esc(v.q)}</h2><p class="muted">Choose your favorite. Results appear after you vote.</p>
<div class="vote-options">${v.opts.map((o,i)=>`<button class="vote-option" ${did?'disabled':''} onclick="cast('${v.id}',${i})"><img src="${esc(o.img)}" alt=""><div class="body"><b>${esc(o.name)}</b><div class="muted">${esc(o.desc)}</div>${did?`<div class="resultrow"><div class="resultline"><span>${percentages[i]||0}%</span><span>${Math.round((totals*(percentages[i]||0))/100).toLocaleString()}</span></div><div class="bar"><i style="width:${percentages[i]||0}%"></i></div></div>`:''}</div></button>`).join('')}</div>
${did?`<div class="big-result"><div>🔥 Community result</div><strong>${Math.max(...percentages)}%</strong><div class="muted">${totals.toLocaleString()} people voted</div></div>`:'<div class="vs">VS · PICK ONE</div>'}
<div style="margin-top:18px"><button class="btn primary" onclick="shareVote('${v.id}')">↗ Share ${did?'Results':'Vote'}</button><button class="btn secondary" style="margin-left:6px" onclick="go('create')">Create Your Own Vote</button></div>
</div>
<div class="panel"><h3>🔥 Want to create your own vote?</h3><p class="muted">Ask a question, share it, and let people decide.</p><button class="btn primary" onclick="go('create')">🚀 Create Your Own Vote</button></div>
${did?comments(v):''}</section>`;
}
function cast(id,i){if(state.voted[id])return;let v=state.votes.find(x=>x.id===id);v.votes=(v.votes||0)+1;v.percentages=v.opts.map((_,j)=>j===i?Math.round(68):Math.round(32/(v.opts.length-1)));state.voted[id]=i;state.received++;state.xp+=10;save();render();toast('Vote counted! +10 XP 🎉')}
function comments(v){let cs=state.comments[v.id]||[];return `<div class="panel"><h3>💬 Comments</h3><div style="display:flex;gap:8px"><input id="comment" class="input" placeholder="Share your thoughts..."><button class="btn primary" onclick="addComment('${v.id}')">Post</button></div>${cs.map(c=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>@you</b><div>${esc(c)}</div><small class="muted">♡ Like · Reply · Report</small></div>`).join('')}</div>`}
function addComment(id){let x=document.getElementById('comment').value.trim();if(!x)return;state.comments[id]??=[];state.comments[id].push(x);state.xp+=5;save();render();toast('Comment added +5 XP')}
function profile(){return `<section class="page"><div class="panel"><div class="profile-head"><div class="avatar">V</div><div><h2 style="margin:0">@votera_user</h2><div class="muted">Making decisions more fun.</div><div class="level">${level()}</div></div></div><div class="stats"><div class="stat"><strong>${state.created}</strong>Created</div><div class="stat"><strong>${state.received}</strong>Votes</div><div class="stat"><strong>${state.xp}</strong>XP</div><div class="stat"><strong>${level().split(' ').slice(-1)}</strong>Level</div></div></div><div class="section-head"><h2>Popular votes</h2><button class="btn primary" onclick="go('create')">＋ Create</button></div><div class="grid">${state.votes.slice(0,3).map(card).join('')}</div></section>`}
function leaderboard(){let rows=[['1','@NovaMaker',8240,'👑 Vote Master'],['2','@DesignMind',6720,'💎 Trend Maker'],['3','@GameZone',5410,'💎 Trend Maker'],['4','@VoterPro',3920,'🥇 Influencer'],['5','@Foodie',2870,'🥇 Influencer']];return `<section class="page"><div class="panel"><h2>🏆 Top Creators</h2><p class="muted">Weekly community rankings.</p>${rows.map(r=>`<div class="leader"><span class="rank">${r[0]}</span><div class="avatar" style="width:42px;height:42px;font-size:15px">${r[1][1]}</div><div style="flex:1"><b>${r[1]}</b><div class="level">${r[3]}</div></div><strong>${r[2].toLocaleString()} XP</strong></div>`).join('')}</div><div class="panel"><h3>🎮 Earn XP</h3><p class="muted">Create +100 · Vote +10 · Comment +5 · Share +15 · Daily return +20 · Invite +50</p></div></section>`}
async function shareVote(id){
let v=state.votes.find(x=>x.id===id);let url=location.origin+location.pathname+'#vote/'+id;let text=`${v.q} — Vote on VOTERA`;
if(navigator.share){try{await navigator.share({title:'VOTERA',text,url})}catch(e){}}
else{await navigator.clipboard?.writeText(url);toast('Vote link copied 🔗')}
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function render(){
let {p,id}=current();let content=p==='home'?home():p==='explore'?explore():p==='create'?create():p==='vote'?votePage(id):p==='profile'?profile():p==='leaderboard'?leaderboard():home();document.getElementById('app').innerHTML=content;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===p));window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
