<style>

:root{
  --primary:#6c5ce7;
  --primary-dark:#5848d6;
  --bg:#f7f7fb;
  --card:#ffffff;
  --text:#17171c;
  --muted:#777783;
  --border:#e8e8ef;
  --soft:#f0eeff;
  --success:#16a34a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input{
  font-family:inherit;
}

button{
  border:0;

}

a{
  text-decoration:none;
  color:inherit;
}


/* ================= HEADER ================= */

header{
  height:68px;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}

.nav{
  width:100%;
  max-width:1100px;
  height:100%;
  margin:auto;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{

  font-weight:950;
  letter-spacing:-1px;
  direction:ltr;
}

.logo span{
  color:var(--primary);
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:9px;
}

.nav-button{
  padding:10px 14px;
  border-radius:11px;
  font-size:12px;
  font-weight:900;
}

.login-button{
  background:#f0eeff;
  color:var(--primary);
}

.create-button{
  background:var(--primary);
  color:white;
}

.create-button:hover{
  background:var(--primary-dark);
}


/* ================= HERO ================= */

.hero{

  max-width:1000px;
  margin:auto;
  padding:70px 18px 45px;

}

.hero-badge{

  color:var(--primary);

}

.hero h1{
  font-size:42px;

  font-weight:950;
  letter-spacing:-1px;
  margin-bottom:15px;
}

.hero h1 span{

}

.hero p{
  max-width:600px;
  margin:auto;
  color:var(--muted);
  font-size:15px;
  line-height:1.8;
}

.hero-actions{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:25px;

}

.hero-button{

  border-radius:13px;

.hero-primary{

}

.hero-secondary{
  background:white;
  color:var(--primary);

}


/* ================= MAIN ================= */

.main{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:0 18px 60px;
}


/* ================= SEARCH ================= */

.search-box{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:25px;
}

.search-icon{
  font-size:18px;
  padding-right:7px;
}

.search-box input{
  flex:1;
  border:0;
  outline:none;
  font-size:13px;
  background:transparent;
  color:var(--text);
}

.search-box input::placeholder{
  color:#9999a4;
}

.search-button{
  background:var(--primary);
  color:white;
  padding:10px 15px;
  border-radius:10px;
  font-size:11px;
  font-weight:900;
}


/* ================= CATEGORIES ================= */

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:6px;
  margin-bottom:30px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex-shrink:0;
  padding:9px 14px;
  border:1px solid var(--border);
  background:white;
  border-radius:30px;
  font-size:11px;
  font-weight:900;
  color:var(--muted);
}

.category.active{
  background:var(--primary);
  border-color:var(--primary);
  color:white;
}


/* ================= SECTION ================= */

.section{
  margin-bottom:35px;
}

.section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.section-title{
  font-size:20px;
  font-weight:950;
}

.section-title span{
  color:var(--primary);
}

.refresh-button{
  background:white;

  color:var(--muted);
  padding:8px 11px;
  border-radius:10px;
  font-size:11px;
  font-weight:900;
}


/* ================= VOTES GRID ================= */

.votes-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}


/* ================= VOTE CARD ================= */

.vote-item{
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px;
  transition:.2s;
}

.vote-item:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(0,0,0,.05);
}

.vote-category{
  display:inline-block;
  background:#f0eeff;
  color:var(--primary);
  padding:6px 9px;
  border-radius:15px;
  font-size:10px;
  font-weight:900;
  margin-bottom:11px;
}

.vote-question{
  font-size:16px;
  font-weight:950;
  line-height:1.5;
  margin-bottom:14px;
}

.vote-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.vote-option{
  min-width:0;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  background:#fafafd;
}

.option-image{
  width:100%;
  height:100px;
  object-fit:cover;
  display:none;
}

.option-content{
  padding:10px;
  display:flex;
  align-items:center;
  gap:8px;
}

.option-letter{
  width:27px;
  height:27px;
  min-width:27px;
  background:#ece9ff;
  color:var(--primary);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:950;
}

.option-name{
  font-size:11px;
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.vote-bottom{
  margin-top:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.vote-count{
  color:var(--muted);
  font-size:10px;
}

.vote-now{
  background:var(--primary);
  color:white;
  padding:9px 13px;
  border-radius:10px;
  font-size:10px;
  font-weight:950;
}

.share-small{
  background:#f0eeff;
  color:var(--primary);
  padding:9px 11px;
  border-radius:10px;
  font-size:10px;
  font-weight:950;
}


/* ================= EMPTY ================= */

.empty{
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  padding:40px 20px;
  text-align:center;
  color:var(--muted);
}

.empty-icon{
  font-size:35px;
  margin-bottom:10px;
}

.empty h3{
  color:var(--text);
  font-size:16px;
  margin-bottom:7px;
}

.empty p{
  font-size:12px;
  line-height:1.7;
}


/* ================= LOADING ================= */

.loading{
  text-align:center;
  padding:40px;
  color:var(--muted);
  font-size:12px;
}

.spinner{
  width:35px;
  height:35px;
  border:4px solid #e8e8ef;
  border-top-color:var(--primary);
  border-radius:50%;
  margin:0 auto 12px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* ================= MESSAGE ================= */

.message{
  display:none;
  padding:13px;
  margin-bottom:18px;
  border-radius:12px;
  text-align:center;
  font-size:12px;
  font-weight:800;
}

.message.success{
  display:block;
  background:#ecfdf3;
  color:#166534;
}

.message.error{
  display:block;
  background:#fff0f0;
  color:#b42318;
}


/* ================= FOOTER ================= */

footer{
  border-top:1px solid var(--border);
  background:white;
  padding:30px 18px;
  text-align:center;
}

.footer-logo{
  font-size:22px;
  font-weight:950;
  direction:ltr;
  margin-bottom:8px;
}

.footer-logo span{

}

footer p{

/* ================= DESKTOP ================= */

@media(min-width:700px){

  .votes-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .hero{
    padding-top:90px;

  }

  }

  .vote-question{

  }

@media(max-width:500px){

  }

  }

  .hero h1{
    font-size:34px;
  }

  .hero p{
    font-size:13px;
  }

  .search-button{
    display:none;
  }

}

</style>

</head>

<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://vatlwkuagxyrvwclttfz.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_7zlCZUTtFzvs_Ytv5XnvEg_y6tOWY94";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* ==========================================
   VARIABLES
========================================== */

let allVotes = [];

let selectedCategory = "الكل";


/* ==========================================
   ELEMENTS
========================================== */

const trendingVotes =
document.getElementById(
  "trendingVotes"
);

const latestVotes =
document.getElementById(
  "latestVotes"
);

const searchInput =
document.getElementById(
  "searchInput"
);

const message =
document.getElementById(
  "message"
);


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text,type){

  message.textContent =
    text;

  message.className =
    "message " + type;

  setTimeout(
    function(){

      message.className =
        "message";

    },
    3000
  );

}


/* ==========================================
   GOOGLE LOGIN
========================================== */

async function signInWithGoogle(){

  try{

    const {
      error
    } =
    await supabaseClient.auth.signInWithOAuth({

      provider:"google",

      options:{

        redirectTo:
        window.location.href

      }

    });


    if(error){

      console.error(error);

      showMessage(
        "حدث خطأ أثناء تسجيل الدخول.",
        "error"
      );

    }

  }catch(error){

    console.error(error);

    showMessage(
      "تعذر الاتصال.",
      "error"
    );

  }

}


/* ==========================================
   LOAD VOTES
========================================== */

async function loadVotes(){

  trendingVotes.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      جارٍ تحميل التصويتات...
    </div>
  `;


  latestVotes.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      جارٍ تحميل التصويتات...
    </div>
  `;


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("votes")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(50);


    if(error){

      console.error(error);

      showEmpty(
        trendingVotes,
        "تعذر تحميل التصويتات."
      );

      showEmpty(
        latestVotes,
        "تعذر تحميل التصويتات."
      );

      return;

    }


    allVotes =
      data || [];


    renderVotes();


  }catch(error){

    console.error(error);

    showEmpty(
      trendingVotes,
      "حدث خطأ أثناء تحميل التصويتات."
    );

    showEmpty(
      latestVotes,
      "حدث خطأ أثناء تحميل التصويتات."
    );

  }

}


/* ==========================================
   RENDER VOTES
========================================== */

function renderVotes(){

  let filtered =
    [...allVotes];


  /* CATEGORY */

  if(
    selectedCategory !==
    "الكل"
  ){

    filtered =
      filtered.filter(
      function(vote){

        return vote.category ===
          selectedCategory;

      });

  }


  /* SEARCH */

  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  if(search){

    filtered =
      filtered.filter(
      function(vote){

        return (
          String(
            vote.question || ""
          )
          .toLowerCase()
          .includes(search)
        );

      });

  }


  /* LATEST */

  const latest =
    filtered.slice(
      0,
      10
    );


  /*
    TRENDING
    ترتيب تقريبي حسب مجموع الأصوات
  */

  const trending =
    [...filtered]
      .sort(
      function(a,b){

        return (
          calculateTotal(b) -
          calculateTotal(a)
        );

      })
      .slice(
        0,
        10
      );


  renderVoteList(
    trendingVotes,
    trending
  );


  renderVoteList(
    latestVotes,
    latest
  );

}


/* ==========================================
   RENDER LIST
========================================== */

function renderVoteList(container,votes){

  container.innerHTML =
    "";


  if(!votes.length){

    showEmpty(
      container,
      "لا توجد تصويتات حاليًا.",
      "أنشئ أول تصويت وابدأ النقاش!"
    );

    return;

  }


  votes.forEach(
    function(vote){

      container.appendChild(
        createVoteCard(vote)
      );

    }
  );

}


/* ==========================================
   CREATE CARD
========================================== */

function createVoteCard(vote){

  const card =
    document.createElement(
      "article"
    );


  card.className =
    "vote-item";


  const options =
    getVoteOptions(vote);


  const total =
    calculateTotal(vote);


  let optionsHTML =
    "";


  options
    .slice(0,4)
    .forEach(
    function(option){

      optionsHTML += `

        <div class="vote-option">

          ${
            option.image
            ?
            `
            <img
              class="option-image"
              src="${escapeAttribute(option.image)}"
              alt=""
              style="display:block;"
            >
            `
            :
            ""
          }

          <div class="option-content">

            <div class="option-letter">
              ${option.letter}
            </div>

            <div class="option-name">
              ${escapeHtml(option.name)}
            </div>

          </div>

        </div>

      `;

    });


  card.innerHTML = `

    <div class="vote-category">

      ${getCategoryEmoji(vote.category)}
      ${escapeHtml(vote.category || "عام")}

    </div>


    <h3 class="vote-question">

      ${escapeHtml(
        vote.question || "بدون سؤال"
      )}

    </h3>


    <div class="vote-options">

      ${optionsHTML}

    </div>


    <div class="vote-bottom">

      <span class="vote-count">

        🗳️
        ${total}
        ${total === 1 ? "صوت" : "أصوات"}

      </span>


      <div
        style="
          display:flex;
          gap:6px;
        "
      >

        <button
          class="share-small"
          onclick="shareVote('${escapeAttribute(vote.id)}')"
        >
          📤 مشاركة
        </button>


        <button
          class="vote-now"
          onclick="openVote('${escapeAttribute(vote.id)}')"
        >
          صوّت الآن →
        </button>

      </div>

    </div>

  `;


  return card;

}


/* ==========================================
   GET OPTIONS
========================================== */

function getVoteOptions(vote){

  const options = [];


  for(
    let i = 0;
    i < 15;
    i++
  ){

    const letter =
      String.fromCharCode(
        65 + i
      );


    const nameField =
      "option_" +
      letter.toLowerCase();


    const imageField =
      "image_" +
      letter.toLowerCase();


    const name =
      vote[nameField];


    if(
      name &&
      String(name).trim()
    ){

      options.push({

        letter:letter,

        name:String(name).trim(),

        image:
          vote[imageField] || null

      });

    }

  }


  return options;

}


/* ==========================================
   TOTAL
========================================== */

function calculateTotal(vote){

  let total = 0;


  for(
    let i = 0;
    i < 15;
    i++
  ){

    const letter =
      String.fromCharCode(
        65 + i
      );


    const field =
      "votes_" +
      letter.toLowerCase();


    total +=
      Number(
        vote[field] || 0
      );

  }


  return total;

}


/* ==========================================
   CATEGORY EMOJI
========================================== */

function getCategoryEmoji(category){

  const emojis = {

    "عام":"🌐",
    "تقنية":"📱",
    "ألعاب":"🎮",
    "رياضة":"⚽",
    "أفلام":"🎬",
    "موسيقى":"🎵",
    "طعام":"🍔",
    "ترفيه":"😂"

  };


  return emojis[category] || "🌐";

}

function filterCategory(
  category,
  button
){

  selectedCategory =
    category;


  document
    .querySelectorAll(
      ".category"
    )
    .forEach(
    function(item){

      item.classList.remove(
        "active"
      );

    });


  button.classList.add(

  );

}

function openVote(id){

    "vote.html?id=" +

}


/* ==========================================
   SHARE VOTE
========================================== */

async function shareVote(id){

  const link =
    window.location.origin +
    window.location.pathname
      .replace(
        "index.html",
        "vote.html"
      ) +
    "?id=" +
    encodeURIComponent(id);


  const vote =
    allVotes.find(
      function(item){

        return String(item.id) ===
          String(id);

      }
    );


  const text =
    vote
    ?
    "🗳️ " +
    vote.question +
    "\n\nصوّت الآن على VOTERA 👇"
    :
    "🗳️ شاهد هذا التصويت على VOTERA";


  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:
          "VOTERA",

        text:
          text,

        url:
          link

      });

      return;

    }catch(error){

      console.log(
        "Share cancelled"
      );

    }

  }


  try{

    await navigator.clipboard.writeText(
      link
    );


    showMessage(
      "تم نسخ رابط التصويت 🔗",
      "success"
    );


  }catch(error){

    showMessage(
      "انسخ الرابط:\n" +
      link,
      "error"
    );

  }

}


/* ==========================================
   EMPTY
========================================== */

function showEmpty(
  container,
  title,
  description
){

  container.innerHTML = `

    <div class="empty">

      <div class="empty-icon">
        🗳️
      </div>

      <h3>
        ${escapeHtml(title)}
      </h3>

      <p>
        ${
          description
          ?
          escapeHtml(description)
          :
          ""
        }
      </p>

    </div>

  `;

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


/* ==========================================
   ESCAPE ATTRIBUTE
========================================== */

function escapeAttribute(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}
