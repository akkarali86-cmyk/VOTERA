<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOTERA — Ask. Vote. Discover.</title>

<meta name="description" content="VOTERA — Create a question. Let the world decide.">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--bg:#f6f7fb;
--card:#ffffff;
--text:#111827;
--muted:#6b7280;
--border:#e5e7eb;
--primary:#6d4aff;
--primary2:#9b7cff;
--danger:#ef4444;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
}

button,
input,
textarea,
select{
font-family:inherit;
}

button{
cursor:pointer;
}

header{
height:64px;
background:rgba(255,255,255,.92);
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:100;
backdrop-filter:blur(15px);
}

.nav{
max-width:1100px;
height:100%;
margin:auto;
padding:0 18px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:25px;
font-weight:900;
letter-spacing:-1px;
}

.logo span{
color:var(--primary);
}

.desktop-nav{
display:flex;
gap:6px;
}

.nav-btn{
border:0;
background:transparent;
padding:10px 13px;
border-radius:12px;
font-weight:700;
color:var(--muted);
}

.nav-btn:hover,
.nav-btn.active{
background:#eeeaff;
color:var(--primary);
}

main{
max-width:1100px;
margin:auto;
padding-bottom:100px;
}

.page{
display:none;
}

.page.active{
display:block;
}

.hero{
text-align:center;
padding:75px 20px 55px;
}

.badge{
display:inline-block;
padding:8px 14px;
background:#eeeaff;
color:var(--primary);
border-radius:50px;
font-weight:800;
margin-bottom:20px;
}

.hero h1{
font-size:clamp(45px,9vw,82px);
line-height:.95;
letter-spacing:-4px;
margin-bottom:22px;
}

.hero h1 span{
color:var(--primary);
}

.hero p{
max-width:600px;
margin:auto;
font-size:19px;
line-height:1.6;
color:var(--muted);
margin-bottom:28px;
}

.actions{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
}

.primary{
border:0;
background:linear-gradient(135deg,var(--primary),var(--primary2));
color:white;
padding:14px 20px;
border-radius:14px;
font-weight:800;
box-shadow:0 8px 25px #6d4aff30;
}

.secondary{
border:1px solid var(--border);
background:white;
color:var(--text);
padding:14px 20px;
border-radius:14px;
font-weight:800;
}

.section{
padding:25px 18px;
}

.section-title{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.section-title h2{
font-size:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:20px;
overflow:hidden;
box-shadow:0 8px 30px rgba(0,0,0,.05);
}

.card-images{
height:190px;
display:grid;
grid-template-columns:1fr 1fr;
}

.card-images img{
width:100%;
height:100%;
object-fit:cover;
}

.card-images img+img{
border-left:2px solid white;
}

.card-body{
padding:16px;
}

.question{
font-size:18px;
font-weight:800;
margin-bottom:8px;
}

.meta{
color:var(--muted);
font-size:13px;
}

.card-footer{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:15px;
}

.share-btn{
border:0;
