<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VOTERA — Ask. Vote. Discover.</title>

  <meta name="description"
        content="VOTERA — Create a question. Let the world decide.">

  <meta property="og:title"
        content="VOTERA — Ask. Vote. Discover.">

  <meta property="og:description"
        content="Create a question. Let the world decide.">

  <meta name="theme-color" content="#6D4AFF">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #6d4aff;
      --primary-dark: #5434d9;
      --secondary: #ff4f8b;
      --success: #16a34a;
      --danger: #ef4444;
      --shadow: 0 12px 35px rgba(20, 20, 50, 0.08);
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================
       HEADER
    ========================== */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 64px;

      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(18px);

      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1180px;
      height: 100%;

      margin: auto;
      padding: 0 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 25px;
      font-weight: 950;
      letter-spacing: -1.2px;
    }

    .logo span {
      color: var(--primary);
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav-btn {
      border: 0;
      background: transparent;

      padding: 10px 13px;
      border-radius: 12px;

      color: var(--muted);
      font-weight: 800;

      transition: 0.2s;
    }

    .nav-btn:hover {
      background: #eeeaff;
      color: var(--primary);
    }

    .create-nav {
      background: var(--primary);
      color: white;
    }

    .create-nav:hover {
      background: var(--primary-dark);
      color: white;
    }

    /* =========================
       APP
    ========================== */

    #app {
      min-height: calc(100vh - 64px);
    }

    .page {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container {
      width: min(1180px, 100%);
      margin: auto;
      padding: 20px;
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      position: relative;
      overflow: hidden;

      text-align: center;

      padding: 90px 20px 70px;
    }

    .hero::before {
      content: "";

      position: absolute;

      width: 380px;
      height: 380px;

      border-radius: 50%;

      background: rgba(109, 74, 255, 0.10);

      filter: blur(60px);

      top: -160px;
      left: 50%;

      transform: translateX(-50%);

      pointer-events: none;
    }

    .hero-badge {
      position: relative;

      display: inline-flex;
      align-items: center;

      padding: 9px 15px;

      border-radius: 999px;

      background: #eeeaff;
      color: var(--primary);

      font-size: 13px;
      font-weight: 900;

      margin-bottom: 22px;
    }

    .hero h1 {
      position: relative;

      font-size: clamp(48px, 10vw, 88px);

      line-height: 0.94;

      letter-spacing: -5px;

      margin-bottom: 25px;
    }

    .hero h1 span {
      color: var(--primary);
    }

    .hero-description {
      position: relative;

      max-width: 620px;

      margin: 0 auto 30px;

      color: var(--muted);

      font-size: 18px;

      line-height: 1.6;
    }

    .hero-actions {
      position: relative;

      display: flex;
      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;
    }

    /* =========================
       BUTTONS
    ========================== */

    .btn {
      border: 0;

      padding: 13px 19px;

      border-radius: 14px;

      font-weight: 900;

      transition:
        transform 0.15s,
        box-shadow 0.15s,
        background 0.15s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      color: white;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          #9878ff
        );

      box-shadow:
        0 10px 25px rgba(109,74,255,0.25);
    }

    .btn-primary:hover {
      box-shadow:
        0 14px 32px rgba(109,74,255,0.32);
    }

    .btn-secondary {
      background: white;

      border: 1px solid var(--border);

      color: var(--text);
    }

    .btn-secondary:hover {
      background: #fafafa;
    }

    .btn-danger {
      background: #fff0f0;
      color: var(--danger);
    }

    /* =========================
       SECTION
    ========================== */

    .section {
      padding: 15px 0 45px;
    }

    .section-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 18px;
    }

    .section-title {
      font-size: 25px;
      font-weight: 950;
      letter-spacing: -0.7px;
    }

    .section-subtitle {
      color: var(--muted);
      margin-top: 5px;
      font-size: 14px;
    }

    /* =========================
       CATEGORIES
    ========================== */

    .categories {
      display: flex;

      gap: 8px;

      overflow-x: auto;

      padding-bottom: 15px;

      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex-shrink: 0;

      border: 1px solid var(--border);

      background: white;

      color: var(--text);

      padding: 9px 14px;

      border-radius: 999px;

      font-size: 13px;

      font-weight: 800;

      transition: 0.2s;
    }

    .category:hover,
    .category.active {
      background: #eeeaff;
      color: var(--primary);

      border-color: #ddd5ff;
    }

    /* =========================
       VOTE GRID
    ========================== */

    .vote-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 18px;
    }

    .vote-card {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 21px;

      overflow: hidden;

      box-shadow: var(--shadow);

      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }

    .vote-card:hover {
      transform: translateY(-4px);

      box-shadow:
        0 18px 45px rgba(20,20,50,0.12);
    }

    .vote-images {
      display: grid;

      grid-template-columns: 1fr 1fr;

      height: 190px;
    }

    .vote-image {
      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 48px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #6d4aff,
          #a678ff
        );
    }

    .vote-image + .vote-image {
      border-left: 2px solid white;

      background:
        linear-gradient(
          135deg,
          #ff4f8b,
          #ff9d5c
        );
    }

    .vote-body {
      padding: 16px;
    }

    .vote-question {
      font-size: 18px;

      line-height: 1.35;

      font-weight: 900;

      margin-bottom: 8px;
    }

    .vote-meta {
      color: var(--muted);

      font-size: 13px;

      margin-bottom: 14px;
    }

    .vote-footer {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;
    }

    .vote-footer .btn {
      flex: 1;
    }

    .share-small {
      width: 44px;
      height: 44px;

      flex-shrink: 0;

      border: 1px solid var(--border);

      background: white;

      border-radius: 13px;

      font-size: 18px;
    }

    /* =========================
       EMPTY / PLACEHOLDER
    ========================== */

    .empty {
      padding: 55px 20px;

      text-align: center;

      background: white;

      border: 1px dashed var(--border);

      border-radius: 20px;
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .empty h3 {
      margin-bottom: 7px;
    }

    .empty p {
      color: var(--muted);
      margin-bottom: 18px;
    }

    /* =========================
       FORM
    ========================== */

    .form-container {
      max-width: 780px;
      margin: 25px auto 80px;
    }

    .form-card {
      background: white;

      border: 1px solid var(--border);

      border-radius: 22px;

      padding: 22px;

      box-shadow: var(--shadow);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;

      font-weight: 900;

      margin-bottom: 8px;
    }

    .form-input,
    .form-textarea,
    .form-select {
      width: 100%;

      border: 1px solid var(--border);

      background: #fff;

      color: var(--text);

      padding: 13px 14px;

      border-radius: 13px;

      outline: none;

      transition: 0.2s;
    }

    .form-input:focus,
    .form-textarea:focus,
    .form-select:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px rgba(109,74,255,0.10);
    }

    .form-textarea {
      min-height: 110px;

      resize: vertical;
    }

    .form-row {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 14px;
    }

    /* =========================
       OPTION EDITOR
    ========================== */

    .option-editor {
      border: 1px solid var(--border);

      border-radius: 16px;

      padding: 15px;

      margin-bottom: 12px;

      background: #fafafa;
    }

    .option-top {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 12px;
    }

    .option-number {
      font-weight: 900;

      color: var(--primary);
    }

    .remove-option {
      border: 0;

      background: #fff0f0;

      color: var(--danger);

      width: 32px;
      height: 32px;

      border-radius: 9px;
    }

    .add-option {
      width: 100%;

      border: 1px dashed #cfc7ff;

      background: #f8f6ff;

      color: var(--primary);

      padding: 12px;

      border-radius: 13px;

      font-weight: 900;
    }

    /* =========================
       TOGGLE
    ========================== */

    .settings-box {
      border-top: 1px solid var(--border);

      margin-top: 22px;

      padding-top: 22px;
    }

    .setting {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      padding: 12px 0;
    }

    .setting-info strong {
      display: block;
      margin-bottom: 3px;
    }

    .setting-info small {
      color: var(--muted);
    }

    .toggle {
      position: relative;

      width: 48px;
      height: 28px;

      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;

      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;

      inset: 0;

      background: #d1d5db;

      border-radius: 30px;

      transition: 0.2s;
    }

    .toggle-slider::before {
      content: "";

      position: absolute;

      width: 22px;
      height: 22px;

      left: 3px;
      top: 3px;

      background: white;

      border-radius: 50%;

      transition: 0.2s;

      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    .toggle input:checked + .toggle-slider {
      background: var(--primary);
    }

    .toggle input:checked + .toggle-slider::before {
      transform: translateX(20px);
    }

    /* =========================
       VOTE DETAIL
    ========================== */

    .vote-detail {
      max-width: 850px;

      margin: 30px auto 90px;
    }

    .vote-detail-card {
      background: white;

      border: 1px solid var(--border);

      border-radius: 24px;

      padding: 25px;

      box-shadow: var(--shadow);

      text-align: center;
    }

    .vote-detail-question {
      font-size: clamp(25px, 5vw, 38px);

      font-weight: 950;

      line-height: 1.15;

      margin-bottom: 25px;
    }

    .vote-options {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 15px;
    }

    .vote-option {
      position: relative;

      overflow: hidden;

      background: white;

      border: 2px solid var(--border);

      border-radius: 20px;

      cursor: pointer;

      transition: 0.2s;
    }

    .vote-option:hover {
      border-color: var(--primary);

      transform: translateY(-3px);
    }

    .vote-option-image {
      height: 220px;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 60px;

      background:
        linear-gradient(
          135deg,
          #6d4aff,
          #a678ff
        );

      color: white;
    }

    .vote-option:nth-child(2)
    .vote-option-image {
      background:
        linear-gradient(
          135deg,
          #ff4f8b,
          #ff9d5c
        );
    }

    .vote-option-name {
      padding: 15px;

      font-size: 18px;

      font-weight: 900;
    }

    /* =========================
       RESULTS
    ========================== */

    .results {
      margin-top: 25px;

      display: none;

      text-align: left;
    }

    .results.show {
      display: block;

      animation: fadeIn 0.4s ease;
    }

    .result-row {
      margin-bottom: 18px;
    }

    .result-head {
      display: flex;

      justify-content: space-between;

      margin-bottom: 7px;

      font-weight: 900;
    }

    .result-bar {
      height: 12px;

      background: #eee;

      border-radius: 20px;

      overflow: hidden;
    }

    .result-fill {
      height: 100%;

      width: 0;

      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #a678ff
        );

      transition: width 1s ease;
    }

    /* =========================
       SHARE BOX
    ========================== */

    .share-box {
      margin-top: 25px;

      padding: 20px;

      border-radius: 18px;

      background: #f8f6ff;

      border: 1px solid #e2dcff;
    }

    .share-title {
      font-weight: 950;

      margin-bottom: 12px;
    }

    .share-buttons {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }

    .share-btn {
      border: 1px solid var(--border);

      background: white;

      padding: 10px 13px;

      border-radius: 12px;

      font-weight: 800;
    }

    /* =========================
       PROFILE
    ========================== */

    .profile-card {
      max-width: 780px;

      margin: 25px auto;

      background: white;

      border: 1px solid var(--border);

      border-radius: 22px;

      padding: 25px;

      box-shadow: var(--shadow);

      text-align: center;
    }

    .avatar {
      width: 90px;
      height: 90px;

      margin: auto auto 15px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 38px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--secondary)
        );

      color: white;
    }

    .profile-name {
      font-size: 24px;

      font-weight: 950;
    }

    .profile-username {
      color: var(--muted);

      margin-top: 4px;
    }

    .profile-bio {
      max-width: 500px;

      margin: 14px auto;

      color: var(--muted);

      line-height: 1.5;
    }

    .profile-stats {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-top: 22px;
    }

    .stat {
      padding: 15px;

      background: #f8f8fb;

      border-radius: 15px;
    }

    .stat strong {
      display: block;

      font-size: 22px;

      font-weight: 950;
    }

    .stat span {
      color: var(--muted);

      font-size: 12px;
    }

    /* =========================
       LEADERBOARD
    ========================== */

    .leaderboard {
      max-width: 780px;

      margin: 25px auto 90px;
    }

    .leader-row {
      display: flex;

      align-items: center;

      gap: 12px;

      background: white;

      border: 1px solid var(--border);

      padding: 14px;

      border-radius: 16px;

      margin-bottom: 9px;
    }

    .rank {
      width: 35px;

      text-align: center;

      font-weight: 950;
    }

    .leader-avatar {
      width: 42px;
      height: 42px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #eeeaff;

      color: var(--primary);

      font-weight: 950;
    }

    .leader-info {
      flex: 1;
    }

    .leader-info strong {
      display: block;
    }

    .leader-info small {
      color: var(--muted);
    }

    .xp {
      font-weight: 950;

      color: var(--primary);
    }

    /* =========================
       BOTTOM NAV
    ========================== */

    .bottom-nav {
      display: none;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 850px) {

      .desktop-nav {
        display: none;
      }

      .vote-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .bottom-nav {
        position: fixed;

        left: 0;
        right: 0;
        bottom: 0;

        height: 68px;

        display: flex;

        align-items: center;
        justify-content: space-around;

        background: rgba(255,255,255,0.96);

        backdrop-filter: blur(18px);

        border-top: 1px solid var(--border);

        z-index: 200;
      }

      .bottom-nav button {
        border: 0;

        background: transparent;

        color: var(--muted);

        font-size: 11px;

        font-weight: 900;
      }

      .bottom-nav span {
        display: block;

        font-size: 20px;

        margin-bottom: 3px;
      }
    }

    @media (max-width: 600px) {

      .hero {
        padding: 65px 18px 50px;
      }

      .hero h1 {
        letter-spacing: -3px;
      }

      .container {
        padding: 15px;
      }

      .vote-grid {
        grid-template-columns: 1fr;
      }

      .vote-options {
        grid-template-columns: 1fr;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .profile-stats {
        grid-template-columns:
          repeat(3, 1fr);
      }

      .vote-option-image {
        height: 190px;
      }

    }

  </style>
</head>

/* =========================
   PAGE NAVIGATION
========================= */

function showPage(pageId) {

  const pages =
    document.querySelectorAll(".page");

  pages.forEach(page => {

    page.classList.remove("active");

  });


  const selectedPage =
    document.getElementById(pageId);

  if (selectedPage) {

    selectedPage.classList.add("active");

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });


  if (pageId === "explore") {

    renderExplore();

  }

}
