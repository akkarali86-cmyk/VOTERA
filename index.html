:root{
  --bg:#f6f7fb;
  --card:#fff;
  --text:#111528;
  --muted:#687087;
  --line:#e5e7ef;
  --a:#6c4cff;
  --b:#ff4f8b
}

*{box-sizing:border-box}

body{

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.top{
  position:sticky;

}

.logo{

.logo i{

}

.desktop{

.navbtn,

.badge{

  padding:8px 13px;
  border-radius:999px;
  font-weight:900
}

.hero h1{
  font-size:clamp(43px,10vw,80px);
  line-height:.95;
  letter-spacing:-4px;
  margin:18px 0
}

.hero h1 span{
  color:var(--a)
}

.hero p{
  color:var(--muted);
  font-size:18px;
  max-width:600px;
  margin:0 auto 24px
}

.actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap
}

.primary,
.secondary{
  padding:13px 18px;
  border-radius:14px;
  font-weight:900
}

.primary{
  background:linear-gradient(135deg,var(--a),#9a73ff);
  color:#fff;
  border:0
}

.secondary{
  background:var(--card);
  border:1px solid var(--line);
  color:var(--text)
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:20px 15px 90px
}

.page{display:none}
.page.active{display:block}

.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:18px 0
}

.head h2{margin:0}

.chips{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:12px
}

.chip{
  white-space:nowrap;
  background:var(--card);
  border-color:var(--line)
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 30px #18203b10
}

.thumb{
  display:grid;
  grid-template-columns:1fr 1fr;
  height:190px
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover
}

.thumb img+img{
  border-left:2px solid white
}

.body{padding:15px}

.q{
  font-size:18px;
  font-weight:900
}

.meta{
  color:var(--muted);
  font-size:13px
}

.foot{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:13px
}
