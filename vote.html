<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>التصويت — VOTERA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --primary:#6c5ce7;
  --primary-dark:#5848d6;
  --bg:#f7f7fb;
  --card:#ffffff;
  --text:#17171c;
  --muted:#777783;
  --border:#e8e8ef;
  --success:#16a34a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:50px;
}

button{
  font-family:inherit;
  cursor:pointer;
  border:0;
}

a{
  text-decoration:none;
  color:inherit;
}

/* =========================
   HEADER
========================= */

header{
  height:68px;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
}

.nav{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:950;
  letter-spacing:-1px;
  direction:ltr;
}

.logo span{
  color:var(--primary);
}

.home{
  color:var(--muted);
  font-size:13px;
  font-weight:800;
}

/* =========================
   CONTAINER
========================= */

.container{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:35px 18px;
}

/* =========================
   LOADING
========================= */

.loading{
  text-align:center;
  padding:80px 20px;
  color:var(--muted);
}

.spinner{
  width:40px;
  height:40px;
  border:4px solid #e5e5ef;
  border-top-color:var(--primary);
  border-radius:50%;
  margin:0 auto 15px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================
   MESSAGE
========================= */

.message{
  display:none;
  padding:14px;
  border-radius:13px;
  margin-bottom:16px;
  font-size:13px;
  font-weight:800;
  text-align:center;
  white-space:pre-line;
}

.message.error{
  display:block;
  background:#fff0f0;
  color:#b42318;
  border:1px solid #ffd0d0;
}

.message.success{
  display:block;
  background:#ecfdf3;
  color:#166534;
  border:1px solid #bbf7d0;
}

/* =========================
   VOTE CARD
========================= */

.vote-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.04);
}

.category{
  display:inline-block;
  background:#ece9ff;
  color:var(--primary);
  padding:7px 12px;
  border-radius:30px;
  font-size:11px;
  font-weight:900;
  margin-bottom:16px;
}

.question{
  font-size:27px;
  line-height:1.45;
  font-weight:950;
  margin-bottom:10px;
}

.vote-info{
  color:var(--muted);
  font-size:12px;
  margin-bottom:25px;
}

/* =========================
   OPTIONS
========================= */

.options{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.vote-option{
  position:relative;
  width:100%;
  border:2px solid var(--border);
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  text-align:right;
  transition:.2s;
}

.vote-option:hover{
  border-color:#c9c5f5;
  transform:translateY(-1px);
}

.vote-option.selected{
  border-color:var(--primary);
  background:#faf9ff;
}

.option-image{
  width:100%;
  height:190px;
  object-fit:cover;
  display:none;
}

.option-content{
  padding:17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.option-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.option-letter{
  width:37px;
  height:37px;
  border-radius:50%;
  background:#f0eeff;
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:950;
  flex-shrink:0;
}

.option-name{
  font-size:15px;
  font-weight:900;
  word-break:break-word;
}

.radio{
  width:21px;
  height:21px;
  border:2px solid #cfcfda;
  border-radius:50%;
  flex-shrink:0;
}

.vote-option.selected .radio{
  border-color:var(--primary);
  background:var(--primary);
  box-shadow:inset 0 0 0 5px white;
}

/* =========================
   RESULTS
========================= */

.result-bar{
  display:none;
  padding:0 17px 17px;
}

.result-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:7px;
  font-size:12px;
  font-weight:900;
}

.result-percent{
  color:var(--primary);
}

.progress{
  width:100%;
  height:9px;
  background:#eeeeF4;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  width:0%;
  height:100%;
  background:var(--primary);
  border-radius:20px;
  transition:width .5s ease;
}

/* =========================
   VOTE BUTTON
========================= */

.vote-button{
  width:100%;
  margin-top:20px;
  padding:16px;
  border-radius:15px;
  background:var(--primary);
  color:white;
  font-size:16px;
  font-weight:950;
  box-shadow:0 9px 24px rgba(108,92,231,.22);
}

.vote-button:hover{
  background:var(--primary-dark);
}

.vote-button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* =========================
   SHARE
========================= */

.share-section{
  margin-top:17px;
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
}

.share-title{
  font-size:15px;
  font-weight:950;
  margin-bottom:13px;
}

.share-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.share-btn{
  padding:12px 7px;
  border-radius:12px;
  font-size:11px;
  font-weight:900;
}

.whatsapp{
  background:#eafaf0;
  color:#128c48;
}

.facebook{
  background:#eef3ff;
  color:#1877f2;
}

.copy{
  background:#f1efff;
  color:var(--primary);
}

.native-share{
  width:100%;
  margin-top:9px;
  padding:12px;
  border-radius:12px;
  background:#f5f5f8;
  color:#333;
  font-size:12px;
  font-weight:900;
}

/* =========================
   CREATE CTA
========================= */

.create-box{
  text-align:center;
  margin-top:17px;
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
}

.create-box p{
  color:var(--muted);
  font-size:12px;
  margin-bottom:13px;
}

.create-btn{
  display:inline-block;
  background:var(--primary);
  color:white;
  padding:12px 20px;
  border-radius:12px;
  font-size:13px;
  font-weight:900;
}

/* =========================
   EMPTY
========================= */

.empty{
  display:none;
  text-align:center;
  padding:70px 20px;
}

.empty-icon{
  font-size:50px;
  margin-bottom:15px;
}

.empty h2{
  font-size:22px;
  margin-bottom:8px;
}

.empty p{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

  .container{
    padding-top:50px;
  }

  .vote-card{
    padding:30px;
  }

  .question{
    font-size:32px;
  }

}

</style>

</head>


<body>


<header>

<nav class="nav">

<a href="index.html" class="logo">
VOTE<span>RA</span>
</a>

<a href="index.html" class="home">
الرئيسية ←
</a>

</nav>

</header>


<main class="container">


<!-- LOADING -->

<div id="loading" class="loading">

<div class="spinner"></div>

<p>
جارٍ تحميل التصويت...
</p>

</div>


<!-- EMPTY -->

<div id="empty" class="empty">

<div class="empty-icon">
😕
</div>

<h2>
التصويت غير موجود
</h2>

<p>
ربما تم حذف التصويت أو أن الرابط غير صحيح.
</p>

</div>


<!-- CONTENT -->

<div id="content" style="display:none;">


<div id="message" class="message"></div>


<!-- VOTE -->

<section class="vote-card">


<div
id="category"
class="category"
>
🌐 عام
</div>


<h1
id="question"
class="question"
>
...
</h1>


<div
id="voteInfo"
class="vote-info"
>
0 صوت
</div>


<div
id="options"
class="options"
>
</div>


<button
id="voteButton"
class="vote-button"
onclick="submitVote()"
>
🗳️ تصويت
</button>


</section>


<!-- SHARE -->

<section class="share-section">

<div class="share-title">
📤 شارك هذا التصويت
</div>


<div class="share-buttons">


<button
class="share-btn whatsapp"
onclick="shareWhatsApp()"
>
🟢 واتساب
</button>


<button
class="share-btn facebook"
onclick="shareFacebook()"
>
🔵 فيسبوك
</button>

class="share-btn copy"
onclick="copyLink()"
>
🔗 نسخ الرابط
</button>


</div>

id="nativeShare"
class="native-share"
onclick="nativeShare()"
>
📲 مشاركة عبر الهاتف
</button>


</section>


<!-- CREATE -->

<section class="create-box">

<p>
هل لديك سؤال تريد أن يقرر المجتمع بشأنه؟
</p>

<a
href="create.html"
class="create-btn"
>
🔥 أنشئ تصويتك الآن
</a>

</section>


</div>


</main>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://vatlwkuagxyrvwclttfz.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_7zlCZUTtFzvs_Ytv5XnvEg_y6tOWY94";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* ==========================================
   VARIABLES
========================================== */

let vote = null;

let selectedOption = null;

let currentUser = null;

let hasVoted = false;


/* ==========================================
   ELEMENTS
========================================== */

const loading =
document.getElementById("loading");

const empty =
document.getElementById("empty");

const content =
document.getElementById("content");

const message =
document.getElementById("message");

const optionsContainer =
document.getElementById("options");

const voteButton =
document.getElementById("voteButton");


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text,type){

  message.textContent =
    text;

  message.className =
    "message " + type;

}


/* ==========================================
   GET VOTE ID
========================================== */

function getVoteId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("id");

}


/* ==========================================
   LOAD USER
========================================== */

async function loadUser(){

  try{

    const {
      data:{
        session
      }
    } =
    await supabaseClient.auth.getSession();


    currentUser =
      session?.user || null;

  }catch(error){

    console.error(error);

  }

}


/* ==========================================
   LOAD VOTE
========================================== */

async function loadVote(){

  const voteId =
    getVoteId();


  if(!voteId){

    loading.style.display =
      "none";

    empty.style.display =
      "block";

    return;

  }


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("votes")
      .select("*")
      .eq("id",voteId)
      .single();


    if(error){

      console.error(
        "Load vote error:",
        error
      );

      throw error;

    }


    if(!data){

      throw new Error(
        "Vote not found"
      );

    }


    vote =
      data;


    renderVote();


  }catch(error){

    console.error(error);

    loading.style.display =
      "none";

    empty.style.display =
      "block";

  }

}


/* ==========================================
   RENDER VOTE
========================================== */

function renderVote(){

  loading.style.display =
    "none";

  content.style.display =
    "block";


  document
    .getElementById("question")
    .textContent =
      vote.question;


  document
    .getElementById("category")
    .textContent =
      getCategoryEmoji(vote.category) +
      " " +
      (vote.category || "عام");


  renderOptions();

  updateVoteInfo();

}


/* ==========================================
   CATEGORY EMOJI
========================================== */

function getCategoryEmoji(category){

  const emojis = {

    "عام":"🌐",

    "تقنية":"📱",

    "ألعاب":"🎮",

    "رياضة":"⚽",

    "أفلام":"🎬",

    "موسيقى":"🎵",

    "طعام":"🍔",

    "ترفيه":"😂"

  };


  return emojis[category] || "🌐";

}


/* ==========================================
   GET OPTIONS
========================================== */

function getOptions(){

  const letters =
    "abcdefghijklmno";

  const result = [];


  for(
    let i = 0;
    i < letters.length;
    i++
  ){

    const letter =
      letters[i];


    const name =
      vote[
        "option_" + letter
      ];


    if(
      name &&
      String(name).trim()
    ){

      result.push({

        letter:
          letter.toUpperCase(),

        name:
          String(name),

        votes:
          Number(
            vote[
              "votes_" + letter
            ] || 0
          )

      });

    }

  }


  return result;

}


/* ==========================================
   RENDER OPTIONS
========================================== */

function renderOptions(){

  optionsContainer.innerHTML =
    "";


  const options =
    getOptions();


  options.forEach(
  function(option,index){

    const button =
      document.createElement("button");


    button.type =
      "button";


    button.className =
      "vote-option";


    button.dataset.letter =
      option.letter;


    button.onclick =
      function(){

        selectOption(
          option.letter,
          button
        );

      };


    button.innerHTML = `

      <div class="option-content">

        <div class="option-left">

          <div class="option-letter">
            ${option.letter}
          </div>

          <div class="option-name">
            ${escapeHTML(option.name)}
          </div>

        </div>

        <div class="radio"></div>

      </div>

      <div class="result-bar">

        <div class="result-top">

          <span>
            ${option.votes} صوت
          </span>

          <span
            class="result-percent"
          >
            0%
          </span>

        </div>

        <div class="progress">

          <div
            class="progress-fill"
          ></div>

        </div>

      </div>

    `;


    optionsContainer.appendChild(
      button
    );

  });


  if(options.length < 2){

    voteButton.disabled =
      true;

  }


  if(hasVoted){

    showResults();

  }

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* ==========================================
   SELECT OPTION
========================================== */

function selectOption(
  letter,
  button
){

  if(hasVoted){

    return;

  }


  selectedOption =
    letter;


  document
    .querySelectorAll(
      ".vote-option"
    )
    .forEach(
    function(item){

      item.classList.remove(
        "selected"
      );

    });


  button.classList.add(
    "selected"
  );

}


/* ==========================================
   TOTAL VOTES
========================================== */

function getTotalVotes(){

  const options =
    getOptions();


  return options.reduce(
    function(total,option){

      return total +
        option.votes;

    },
    0
  );

}


/* ==========================================
   UPDATE INFO
========================================== */

function updateVoteInfo(){

  const total =
    getTotalVotes();


  document
    .getElementById("voteInfo")
    .textContent =
      total +
      (
        total === 1
        ? " صوت"
        : " أصوات"
      );

}


/* ==========================================
   SUBMIT VOTE
========================================== */

async function submitVote(){

  if(hasVoted){

    showMessage(
      "لقد قمت بالتصويت بالفعل. 🎉",
      "success"
    );

    return;

  }


  if(!selectedOption){

    showMessage(
      "اختر أحد الخيارات أولًا.",
      "error"
    );

    return;

  }


  voteButton.disabled =
    true;

  voteButton.textContent =
    "⏳ جارٍ تسجيل التصويت...";


  try{

    /*
      إذا أردت لاحقًا منع التصويت
      من نفس المستخدم بشكل كامل،
      سنضيف جدولًا منفصلًا للأصوات.
    */


    const column =
      "votes_" +
      selectedOption.toLowerCase();


    const currentVotes =
      Number(
        vote[column] || 0
      );


    const newVotes =
      currentVotes + 1;


    const updateData = {};

    updateData[column] =
      newVotes;


    const {
      data,
      error
    } =
    await supabaseClient
      .from("votes")
      .update(updateData)
      .eq("id",vote.id)
      .select()
      .single();


    if(error){

      console.error(error);

      throw error;

    }


    vote =
      data;


    hasVoted =
      true;


    showMessage(
      "تم تسجيل تصويتك بنجاح! 🎉",
      "success"
    );


    voteButton.textContent =
      "✅ تم التصويت";


    updateVoteInfo();

    showResults();


  }catch(error){

    console.error(
      "Vote error:",
      error
    );


    showMessage(
      "حدث خطأ أثناء تسجيل التصويت:\n" +
      error.message,
      "error"
    );


    voteButton.disabled =
      false;

    voteButton.textContent =
      "🗳️ تصويت";

  }

}


/* ==========================================
   SHOW RESULTS
========================================== */

function showResults(){

  const options =
    getOptions();


  const total =
    getTotalVotes();


  document
    .querySelectorAll(
      ".vote-option"
    )
    .forEach(
    function(button){

      const letter =
        button.dataset.letter;


      const option =
        options.find(
        function(item){

          return item.letter ===
            letter;

        });


      if(!option){

        return;

      }


      const percent =
        total > 0
        ? Math.round(
            (option.votes / total) * 100
          )
        : 0;


      const resultBar =
        button.querySelector(
          ".result-bar"
        );


      const percentText =
        button.querySelector(
          ".result-percent"
        );


      const fill =
        button.querySelector(
          ".progress-fill"
        );


      resultBar.style.display =
        "block";


      percentText.textContent =
        percent + "%";


      fill.style.width =
        percent + "%";

    });


  document
    .querySelectorAll(
      ".vote-option"
    )
    .forEach(
    function(button){

      button.style.cursor =
        "default";

    });

}


/* ==========================================
   SHARE URL
========================================== */

function getShareUrl(){

  return window.location.href;

}


/* ==========================================
   SHARE TEXT
========================================== */

function getShareText(){

  return (
    "🔥 ما رأيك؟\n\n" +
    vote.question +
    "\n\n" +
    "صوّت الآن على VOTERA 👇"
  );

}


/* ==========================================
   WHATSAPP
========================================== */

function shareWhatsApp(){

  const url =
    "https://wa.me/?text=" +
    encodeURIComponent(
      getShareText() +
      "\n" +
      getShareUrl()
    );


  window.open(
    url,
    "_blank"
  );

}


/* ==========================================
   FACEBOOK
========================================== */

function shareFacebook(){

  const url =
    "https://www.facebook.com/sharer/sharer.php?u=" +
    encodeURIComponent(
      getShareUrl()
    );


  window.open(
    url,
    "_blank",
    "width=600,height=500"
  );

}


/* ==========================================
   COPY LINK
========================================== */

async function copyLink(){

  try{

    await navigator.clipboard.writeText(
      getShareUrl()
    );


    showMessage(
      "تم نسخ رابط التصويت! 🔗",
      "success"
    );


  }catch(error){

    /*
      طريقة بديلة للأجهزة القديمة
    */

    const textarea =
      document.createElement("textarea");


    textarea.value =
      getShareUrl();


    document.body.appendChild(
      textarea
    );


    textarea.select();


    document.execCommand(
      "copy"
    );


    textarea.remove();


    showMessage(
      "تم نسخ رابط التصويت! 🔗",
      "success"
    );

  }

}


/* ==========================================
   NATIVE SHARE
========================================== */

async function nativeShare(){

  if(
    !navigator.share
  ){

    showMessage(
      "المشاركة المباشرة غير مدعومة على هذا الجهاز. استخدم واتساب أو نسخ الرابط.",
      "error"
    );

    return;

  }


  try{

    await navigator.share({

      title:
        "تصويت على VOTERA",

      text:
        getShareText(),

      url:
        getShareUrl()

    });

  }catch(error){

    /*
      المستخدم قد يغلق نافذة المشاركة.
      لا نعرض خطأ في هذه الحالة.
    */

    console.log(
      "Share cancelled"
    );

  }

}


/* ==========================================
   AUTH STATE
========================================== */
