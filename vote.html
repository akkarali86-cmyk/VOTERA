<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>التصويت — VOTERA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --primary:#6c5ce7;
  --primary-dark:#5848d6;
  --bg:#f7f7fb;
  --card:#fff;
  --text:#17171c;
  --muted:#777783;
  --border:#e8e8ef;
  --success:#16a34a;
  --danger:#e74c3c;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:50px;
}

button{
  font-family:inherit;
  cursor:pointer;
  border:0;
}

button:disabled{
  cursor:not-allowed;
  opacity:.7;
}

a{
  text-decoration:none;
  color:inherit;
}


/* ================= HEADER ================= */

header{
  height:68px;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
}

.nav{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:950;
  letter-spacing:-1px;
  direction:ltr;
}

.logo span{
  color:var(--primary);
}

.back{
  color:var(--muted);
  font-size:13px;
  font-weight:800;
}


/* ================= CONTAINER ================= */

.container{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:35px 18px;
}


/* ================= LOADING ================= */

.loading{
  text-align:center;
  padding:80px 20px;
  color:var(--muted);
}

.spinner{
  width:40px;
  height:40px;
  border:4px solid #e8e8ef;
  border-top-color:var(--primary);
  border-radius:50%;
  margin:0 auto 18px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* ================= MESSAGE ================= */

.message{
  display:none;
  padding:14px;
  margin-bottom:16px;
  border-radius:13px;
  font-size:13px;
  font-weight:800;
  text-align:center;
  white-space:pre-line;
}

.message.error{
  display:block;
  background:#fff0f0;
  color:#b42318;
  border:1px solid #ffd0d0;
}

.message.success{
  display:block;
  background:#ecfdf3;
  color:#166534;
  border:1px solid #bbf7d0;
}


/* ================= VOTE CARD ================= */

.vote-card{
  background:white;
  border:1px solid var(--border);
  border-radius:24px;
  padding:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.04);
}

.category{
  display:inline-block;
  background:#ece9ff;
  color:var(--primary);
  padding:7px 12px;
  border-radius:20px;
  font-size:11px;
  font-weight:900;
  margin-bottom:15px;
}

.question{
  font-size:27px;
  line-height:1.45;
  margin-bottom:10px;
  font-weight:950;
}

.vote-meta{
  color:var(--muted);
  font-size:12px;
  margin-bottom:23px;
}


/* ================= OPTIONS ================= */

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  position:relative;
  width:100%;
  border:1px solid var(--border);
  background:#fafafd;
  border-radius:17px;
  padding:16px;
  transition:.2s;
  overflow:hidden;
}

.option:hover{
  border-color:#cfc9ff;
  transform:translateY(-1px);
}

.option-top{
  display:flex;
  align-items:center;
  gap:12px;
}

.option-letter{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:12px;
  background:#ece9ff;
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:950;
  font-size:14px;
}

.option-name{
  flex:1;
  text-align:right;
  font-size:15px;
  font-weight:900;
}

.option-vote-button{
  background:var(--primary);
  color:white;
  padding:9px 13px;
  border-radius:10px;
  font-size:11px;
  font-weight:900;
}

.option-vote-button:hover{
  background:var(--primary-dark);
}


/* ================= OPTION IMAGE ================= */

.option-image{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:13px;
  margin-bottom:12px;
  display:block;
}


/* ================= RESULT ================= */

.result-area{
  display:none;
  margin-top:13px;
}

.result-bar{
  width:100%;
  height:9px;
  background:#e9e9ef;
  border-radius:20px;
  overflow:hidden;
  margin-top:9px;
}

.result-fill{
  height:100%;
  width:0%;
  background:var(--primary);
  border-radius:20px;
  transition:width .7s ease;
}

.result-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  color:var(--muted);
}

.result-percent{
  color:var(--primary);
  font-weight:950;
}

.option.selected{
  border-color:var(--primary);
  background:#f7f5ff;
}

.option.selected .option-letter{
  background:var(--primary);
  color:white;
}


/* ================= ACTIONS ================= */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

.action-button{
  padding:14px;
  border-radius:13px;
  font-size:12px;
  font-weight:900;
}

.share-button{
  background:var(--primary);
  color:white;
}

.copy-button{
  background:#f0eeff;
  color:var(--primary);
}

.action-button:hover{
  opacity:.9;
}


/* ================= SHARE PANEL ================= */

.share-panel{
  display:none;
  margin-top:14px;
  padding:17px;
  background:#fafafd;
  border:1px solid var(--border);
  border-radius:15px;
}

.share-title{
  font-size:13px;
  font-weight:950;
  margin-bottom:12px;
}

.share-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.share-item{
  padding:11px 6px;
  border-radius:11px;
  background:white;
  border:1px solid var(--border);
  font-size:11px;
  font-weight:900;
}

.share-item:hover{
  border-color:var(--primary);
}


/* ================= FOOTER ================= */

.vote-footer{
  text-align:center;
  color:var(--muted);
  font-size:10px;
  line-height:1.6;
  margin-top:18px;
}


/* ================= ERROR ================= */

.error-box{
  display:none;
  background:white;
  border:1px solid var(--border);
  border-radius:22px;
  padding:35px 20px;
  text-align:center;
}

.error-box h2{
  margin-bottom:10px;
}

.error-box p{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

.home-button{
  display:inline-block;
  margin-top:20px;
  background:var(--primary);
  color:white;
  padding:12px 20px;
  border-radius:12px;
  font-size:12px;
  font-weight:900;
}


/* ================= DESKTOP ================= */

@media(min-width:700px){

  .container{
    padding-top:55px;
  }

  .vote-card{
    padding:30px;
  }

  .question{
    font-size:32px;
  }

}

</style>

</head>


<body>


<header>

<nav class="nav">

<a href="index.html" class="logo">
VOTE<span>RA</span>
</a>

<a href="index.html" class="back">
→ الرئيسية
</a>

</nav>

</header>


<main class="container">


<!-- LOADING -->

<div id="loading" class="loading">

<div class="spinner"></div>

<p>
جارٍ تحميل التصويت...
</p>

</div>


<!-- ERROR -->

<div id="errorBox" class="error-box">

<h2>
😕 التصويت غير موجود
</h2>

<p id="errorText">
تعذر العثور على هذا التصويت.
</p>

<a href="index.html" class="home-button">
العودة إلى الرئيسية
</a>

</div>


<!-- MESSAGE -->

<div id="message" class="message"></div>


<!-- VOTE -->

<div id="voteCard" class="vote-card" style="display:none;">


<div id="category" class="category">
🌐 عام
</div>


<h1 id="question" class="question">
السؤال
</h1>


<div id="meta" class="vote-meta">
0 صوت
</div>


<div id="options" class="options">
</div>


<div class="actions">

<button
class="action-button share-button"
onclick="toggleShare()"
>
📤 مشاركة
</button>

<button
class="action-button copy-button"
onclick="copyVoteLink()"
>
🔗 نسخ الرابط
</button>

</div>


<!-- SHARE PANEL -->

<div id="sharePanel" class="share-panel">

<div class="share-title">
📤 مشاركة التصويت
</div>

<div class="share-grid">

<button
class="share-item"
onclick="shareWhatsApp()"
>
🟢 واتساب
</button>

<button
class="share-item"
onclick="shareFacebook()"
>
🔵 فيسبوك
</button>

<button
class="share-item"
onclick="shareNative()"
>
📱 مشاركة
</button>

</div>

</div>


<div class="vote-footer">
شارك التصويت مع أصدقائك ودعهم يقررون 👥
</div>


</div>


</main>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://vatlwkuagxyrvwclttfz.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_7zlCZUTtFzvs_Ytv5XnvEg_y6tOWY94";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* ==========================================
   VARIABLES
========================================== */

let vote = null;

let voteId = null;

let hasVoted = false;

let selectedOption = null;


/* ==========================================
   ELEMENTS
========================================== */

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("errorBox");

const errorText =
document.getElementById("errorText");

const voteCard =
document.getElementById("voteCard");

const message =
document.getElementById("message");

const questionElement =
document.getElementById("question");

const categoryElement =
document.getElementById("category");

const metaElement =
document.getElementById("meta");

const optionsElement =
document.getElementById("options");


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text,type){

  message.textContent =
    text;

  message.className =
    "message " + type;

}


/* ==========================================
   GET VOTE ID
========================================== */

function getVoteId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("id");

}


/* ==========================================
   GET OPTION LETTER
========================================== */

function getOptionLetter(index){

  return String.fromCharCode(
    65 + index
  );

}


/* ==========================================
   LOAD VOTE
========================================== */

async function loadVote(){

  voteId =
    getVoteId();


  if(!voteId){

    showError(
      "رابط التصويت غير صحيح."
    );

    return;

  }


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("votes")
      .select("*")
      .eq("id",voteId)
      .single();


    if(error){

      console.error(
        "Load vote error:",
        error
      );

      showError(
        "تعذر تحميل التصويت."
      );

      return;

    }


    if(!data){

      showError(
        "التصويت غير موجود."
      );

      return;

    }


    vote =
      data;


    checkPreviousVote();

    displayVote();


  }catch(error){

    console.error(error);

    showError(
      "حدث خطأ أثناء تحميل التصويت."
    );

  }

}


/* ==========================================
   DISPLAY VOTE
========================================== */

function displayVote(){

  loading.style.display =
    "none";

  errorBox.style.display =
    "none";

  voteCard.style.display =
    "block";


  questionElement.textContent =
    vote.question || "بدون سؤال";


  categoryElement.textContent =
    getCategoryEmoji(vote.category) +
    " " +
    (vote.category || "عام");


  const total =
    calculateTotalVotes();


  metaElement.textContent =
    formatVotes(total);


  renderOptions();

}


/* ==========================================
   CATEGORY EMOJI
========================================== */

function getCategoryEmoji(category){

  const emojis = {

    "عام":"🌐",

    "تقنية":"📱",

    "ألعاب":"🎮",

    "رياضة":"⚽",

    "أفلام":"🎬",

    "موسيقى":"🎵",

    "طعام":"🍔",

    "ترفيه":"😂"

  };


  return emojis[category] || "🌐";

}


/* ==========================================
   FORMAT VOTES
========================================== */

function formatVotes(number){

  number =
    Number(number || 0);


  if(number === 1){

    return "1 صوت";

  }


  return number + " أصوات";

}


/* ==========================================
   GET OPTIONS FROM JSONB
========================================== */

function getOptions(){

  if(!vote){

    return [];

  }


  let rawOptions =
    vote.options;


  /*
    Supabase يعيد jsonb عادةً كـ Array.
    لكن إذا عاد كنص نحاول تحويله.
  */

  if(typeof rawOptions === "string"){

    try{

      rawOptions =
        JSON.parse(rawOptions);

    }catch(error){

      console.error(
        "Options JSON error:",
        error
      );

      return [];

    }

  }


  if(!Array.isArray(rawOptions)){

    return [];

  }


  return rawOptions
    .map(function(option,index){

      if(!option){

        return null;

      }


      const name =
        option.name;


      if(
        name === null ||
        name === undefined ||
        String(name).trim() === ""
      ){

        return null;

      }


      return {

        letter:
          getOptionLetter(index),

        name:
          String(name).trim(),

        image:
          option.image
          ? String(option.image)
          : "",

        votes:
          Number(option.votes || 0),

        index:
          index

      };

    })
    .filter(Boolean);

}


/* ==========================================
   GET VOTE COUNT
========================================== */

function getVoteCount(letter){

  const options =
    getOptions();


  const option =
    options.find(
      function(item){

        return item.letter === letter;

      }
    );


  if(!option){

    return 0;

  }


  return Number(
    option.votes || 0
  );

}


/* ==========================================
   TOTAL VOTES
========================================== */

function calculateTotalVotes(){

  const options =
    getOptions();


  let total =
    0;


  options.forEach(
    function(option){

      total +=
        Number(
          option.votes || 0
        );

    }
  );


  return total;

}


/* ==========================================
   RENDER OPTIONS
========================================== */

function renderOptions(){

  optionsElement.innerHTML =
    "";


  const options =
    getOptions();


  if(options.length === 0){

    optionsElement.innerHTML = `

      <div style="
        text-align:center;
        padding:25px;
        color:#777783;
        font-size:13px;
      ">

        لا توجد خيارات لهذا التصويت.

      </div>

    `;

    return;

  }


  const total =
    calculateTotalVotes();


  options.forEach(
    function(option){

      const count =
        Number(
          option.votes || 0
        );


      const percentage =
        total > 0
        ? Math.round(
            (count / total) * 100
          )
        : 0;


      const element =
        document.createElement("div");


      element.className =
        "option";


      element.dataset.letter =
        option.letter;


      /*
        صورة الخيار
      */

      let imageHTML =
        "";


      if(option.image){

        imageHTML = `

          <img
            class="option-image"
            src="${escapeAttribute(option.image)}"
            alt="${escapeAttribute(option.name)}"
            loading="lazy"
            onerror="this.style.display='none'"
          >

        `;

      }


      element.innerHTML = `

        ${imageHTML}

        <div class="option-top">

          <div class="option-letter">
            ${option.letter}
          </div>

          <div class="option-name">
            ${escapeHtml(option.name)}
          </div>

          <button
            class="option-vote-button"
            onclick="voteFor('${option.letter}')"
          >
            تصويت
          </button>

        </div>


        <div class="result-area">

          <div class="result-info">

            <span>
              ${count} صوت
            </span>

            <span class="result-percent">
              ${percentage}%
            </span>

          </div>


          <div class="result-bar">

            <div
              class="result-fill"
              style="width:${percentage}%"
            ></div>

          </div>

        </div>

      `;


      optionsElement.appendChild(
        element
      );

    }
  );


  if(hasVoted){

    showResults();

  }

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(text){

  const div =
    document.createElement("div");


  div.textContent =
    text;


  return div.innerHTML;

}


/* ==========================================
   ESCAPE ATTRIBUTE
========================================== */

function escapeAttribute(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* ==========================================
   PREVIOUS VOTE
========================================== */

function checkPreviousVote(){

  if(!voteId){

    return;

  }


  const storageKey =
    "votera_vote_" +
    voteId;


  const previous =
    localStorage.getItem(
      storageKey
    );


  if(previous){

    hasVoted =
      true;

    selectedOption =
      previous;

  }

}


/* ==========================================
   CHECK AUTH
========================================== */

async function getCurrentSession(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth.getSession();


    if(error){

      console.error(
        "Session error:",
        error
      );

      return null;

    }


    return data.session || null;

  }catch(error){

    console.error(error);

    return null;

  }

}


/* ==========================================
   VOTE
========================================== */

async function voteFor(letter){

  /*
    التأكد من وجود التصويت
  */

  if(!vote || !voteId){

    showMessage(
      "التصويت غير متوفر.",
      "error"
    );

    return;

  }


  /*
    منع التصويت مرة ثانية
  */

  if(hasVoted){

    showMessage(
      "لقد صوتت بالفعل في هذا التصويت. يمكنك مشاهدة النتائج.",
      "error"
    );

    showResults();

    return;

  }


  /*
    التأكد من تسجيل الدخول
  */

  const session =
    await getCurrentSession();


  if(!session){

    showMessage(
      "يجب تسجيل الدخول بحساب Google للتصويت.",
      "error"
    );


    const login =
      confirm(
        "يجب تسجيل الدخول أولًا للتصويت.\n\nهل تريد تسجيل الدخول بحساب Google؟"
      );


    if(login){

      await signInWithGoogleForVote();

    }


    return;

  }


  /*
    البحث عن الخيار
  */

  const options =
    getOptions();


  const selected =
    options.find(
      function(option){

        return option.letter === letter;

      }
    );


  if(!selected){

    showMessage(
      "الخيار غير صحيح.",
      "error"
    );

    return;

  }


  /*
    رقم الخيار في JSON
  */

  const optionIndex =
    selected.index;


  /*
    تعطيل الأزرار
  */

  disableVoteButtons();


  showMessage(
    "⏳ جارٍ تسجيل صوتك...",
    "success"
  );


  try{

    /*
      استدعاء دالة Supabase
    */

    const {
      data,
      error
    } =
    await supabaseClient.rpc(
      "cast_vote",
      {
        p_vote_id:
          voteId,

        p_option_index:
          optionIndex
      }
    );


    /*
      خطأ
    */

    if(error){

      console.error(
        "Cast vote error:",
        error
      );


      enableVoteButtons();


      if(
        error.message &&
        error.message.includes(
          "لقد صوتت بالفعل"
        )
      ){

        hasVoted =
          true;

        showMessage(
          "لقد صوتت بالفعل في هذا التصويت.",
          "error"
        );

        await reloadVote();

        return;

      }


      if(
        error.message &&
        error.message.includes(
          "يجب تسجيل الدخول"
        )
      ){

        showMessage(
          "يجب تسجيل الدخول أولًا للتصويت.",
          "error"
        );

        return;

      }


      showMessage(
        "فشل تسجيل التصويت:\n" +
        error.message,
        "error"
      );

      return;

    }


    /*
      التأكد من النجاح
    */

    if(
      !data ||
      data.success !== true
    ){

      enableVoteButtons();


      showMessage(
        "لم يتم تسجيل التصويت.",
        "error"
      );


      return;

    }


    /*
      حفظ الاختيار محليًا
    */

    localStorage.setItem(
      "votera_vote_" + voteId,
      letter
    );


    hasVoted =
      true;

    selectedOption =
      letter;


    /*
      إعادة تحميل البيانات
    */

    await reloadVote();


    showMessage(
      "تم تسجيل صوتك بنجاح! 🎉",
      "success"
    );


  }catch(error){

    console.error(
      "Vote error:",
      error
    );


    enableVoteButtons();


    showMessage(
      "حدث خطأ أثناء تسجيل التصويت:\n" +
      error.message,
      "error"
    );

  }

}


/* ==========================================
   GOOGLE LOGIN
========================================== */

async function signInWithGoogleForVote(){

  try{

    const {
      error
    } =
    await supabaseClient.auth.signInWithOAuth({

      provider:"google",

      options:{

        redirectTo:

    });

}


/* ==========================================
   RELOAD VOTE
========================================== */

async function reloadVote(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("votes")
      .select("*")
      .eq("id",voteId)
      .single();


    if(error){

      console.error(
        "Reload vote error:",
        error
      );

      return;

    }


    if(data){

      vote =
        data;


      const total =
        calculateTotalVotes();


      metaElement.textContent =
        formatVotes(total);


      renderOptions();


      showResults();

    }

  }catch(error){

    console.error(
      "Reload error:",
      error
    );

  }

}


/* ==========================================
   DISABLE VOTE BUTTONS
========================================== */

function disableVoteButtons(){

  document
    .querySelectorAll(
      ".option-vote-button"
    )
    .forEach(
      function(button){

        button.disabled =
          true;

        button.textContent =
          "⏳";

      }
    );

}


/* ==========================================
   ENABLE VOTE BUTTONS
========================================== */

function enableVoteButtons(){

  if(hasVoted){

    return;

  }


  document
    .querySelectorAll(
      ".option-vote-button"
    )
    .forEach(
      function(button){

        button.disabled =
          false;

        button.textContent =
          "تصويت";

      }
    );

}


/* ==========================================
   SHOW RESULTS
========================================== */

function showResults(){

  hasVoted =
    true;


  document
    .querySelectorAll(
      ".option"
    )
    .forEach(
      function(option){

        const letter =
          option.dataset.letter;


        const resultArea =
          option.querySelector(
            ".result-area"
          );


        const button =
          option.querySelector(
            ".option-vote-button"
          );


        if(resultArea){

          resultArea.style.display =
            "block";

        }


        if(button){

          button.disabled =
            true;

          button.textContent =
            "تم التصويت";

        }


        if(
          selectedOption === letter
        ){

          option.classList.add(
            "selected"
          );

        }

      }
    );

}


/* ==========================================
   SHARE PANEL
========================================== */

function toggleShare(){

  const panel =
    document.getElementById(
      "sharePanel"
    );


  if(
    panel.style.display ===
    "block"
  ){

    panel.style.display =
      "none";

  }else{

    panel.style.display =
      "block";

  }

}


/* ==========================================
   VOTE LINK
========================================== */

function getVoteLink(){

  return window.location.href;

}


/* ==========================================
   SHARE TEXT
========================================== */

function getShareText(){

  if(!vote){

    return "شاهد هذا التصويت على VOTERA";

  }


  return (
    "🗳️ " +
    vote.question +
    "\n\n" +
    "صوّت الآن على VOTERA 👇"
  );

}


/* ==========================================
   WHATSAPP
========================================== */

function shareWhatsApp(){

  const text =
    getShareText() +
    "\n" +
    getVoteLink();


  const url =
    "https://wa.me/?text=" +
    encodeURIComponent(text);


  window.open(
    url,
    "_blank"
  );

}


/* ==========================================
   FACEBOOK
========================================== */

function shareFacebook(){

  const url =
    "https://www.facebook.com/sharer/sharer.php?u=" +
    encodeURIComponent(
      getVoteLink()
    );


  window.open(
    url,
    "_blank",
    "width=600,height=500"
  );

}


/* ==========================================
   NATIVE SHARE
========================================== */

async function shareNative(){

  const link =
    getVoteLink();


  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:
          vote
          ? vote.question
          : "تصويت VOTERA",

        text:
          getShareText(),

        url:
          link

      });

    }catch(error){

      console.log(
        "Share cancelled"
      );

    }

  }else{

    copyVoteLink();

  }

}


/* ==========================================
   COPY LINK
========================================== */

async function copyVoteLink(){

  const link =
    getVoteLink();


  try{

    await navigator.clipboard.writeText(
      link
    );


    showMessage(
      "تم نسخ رابط التصويت! 🔗",
      "success"
    );


  }catch(error){

    /*
      طريقة احتياطية
    */

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      link;


    textarea.style.position =
      "fixed";

    textarea.style.opacity =
      "0";


    document.body.appendChild(
      textarea
    );


    textarea.select();


    try{

      document.execCommand(
        "copy"
      );


      showMessage(
        "تم نسخ رابط التصويت! 🔗",
        "success"
      );

    }catch(error2){

      showMessage(
        "انسخ الرابط يدويًا:\n" +
        link,
        "error"
      );

    }


    textarea.remove();

  }

}
