<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حسابي — VOTERA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --primary:#6c5ce7;
  --primary-dark:#5848d6;
  --bg:#f7f7fb;
  --card:#fff;
  --text:#17171c;
  --muted:#777783;
  --border:#e8e8ef;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:90px;
}

a{
  text-decoration:none;
  color:inherit;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}

.nav{
  max-width:900px;
  height:68px;
  margin:auto;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1.5px;
}

.logo span{
  color:var(--primary);
}

.back{
  color:var(--primary);
  font-size:14px;
  font-weight:900;
}

/* ACCOUNT */

.container{
  max-width:700px;
  margin:auto;
  padding:35px 18px;
}

.profile-card{
  background:white;
  border:1px solid var(--border);
  border-radius:24px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.04);
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #ece9ff;
  margin-bottom:15px;
}

.name{
  font-size:24px;
  font-weight:900;
  margin-bottom:7px;
}

.email{
  color:var(--muted);
  font-size:14px;
  margin-bottom:25px;
}

.logout{
  background:#f1f1f5;
  border:0;
  padding:12px 20px;
  border-radius:12px;
  font-weight:900;
  cursor:pointer;
}

.logout:hover{
  background:#e7e7ed;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:18px;
}

.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px 8px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:22px;
  margin-bottom:5px;
}

.stat span{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}

/* SECTIONS */

.section{
  margin-top:25px;
}

.section h2{
  font-size:20px;
  margin-bottom:12px;
}

.empty{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:25px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

/* MOBILE NAV */

.mobile-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  z-index:200;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
}

.mobile-nav a{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}

.mobile-nav a.active{
  color:var(--primary);
}

.icon{
  font-size:20px;
}

/* LOGIN */

.login-box{
  text-align:center;
  padding:80px 20px;
}

.login-box h1{
  font-size:25px;
  margin-bottom:12px;
}

.login-box p{
  color:var(--muted);
  margin-bottom:25px;
}

.google-btn{
  background:var(--primary);
  color:white;
  border:0;
  padding:14px 25px;
  border-radius:14px;
  font-weight:900;
  cursor:pointer;
  font-size:15px;
}

@media(min-width:700px){

  .mobile-nav{
    display:none;
  }

  body{
    padding-bottom:30px;
  }

}
</style>
</head>

<body>

<header>

<nav class="nav">

<a href="index.html" class="logo">
VOTE<span>RA</span>
</a>

<a href="index.html" class="back">
← الرئيسية
</a>

</nav>

</header>


<main class="container">

<!-- LOGIN MESSAGE -->

<div
id="loginBox"
class="login-box"
style="display:none;"
>

<h1>
👤 حسابك
</h1>

<p>
يجب تسجيل الدخول باستخدام Google لرؤية حسابك.
</p>

<button
id="googleBtn"
class="google-btn"
>
G &nbsp; تسجيل الدخول باستخدام Google
</button>

</div>


<!-- PROFILE -->

<div
id="profileContent"
style="display:none;"
>

<div class="profile-card">

<img
id="avatar"
class="avatar"
src=""
alt="صورة المستخدم"
>

<div
id="name"
class="name"
>
مستخدم VOTERA
</div>

<div
id="email"
class="email"
>
</div>

<button
id="logoutBtn"
class="logout"
>
🚪 تسجيل الخروج
</button>

</div>


<div class="stats">

<div class="stat">
<strong id="createdCount">0</strong>
<span>تصويتاتي</span>
</div>

<div class="stat">
<strong id="votesCount">0</strong>
<span>أصواتي</span>
</div>

<div class="stat">
<strong id="followersCount">0</strong>
<span>المتابعون</span>
</div>

</div>


<div class="section">

<h2>
🗳️ تصويتاتي
</h2>

<div class="empty">
لم تنشئ أي تصويت بعد.
<br><br>
<a
href="create.html"
style="color:#6c5ce7;font-weight:900;"
>
➕ أنشئ أول تصويت
</a>
</div>

</div>


<div class="section">

<h2>
🔥 نشاطي
</h2>

<div class="empty">
سيظهر هنا نشاطك وتصويتاتك قريبًا.
</div>

</div>

</div>

</main>


<nav class="mobile-nav">

<a href="index.html">
<span class="icon">🏠</span>
الرئيسية
</a>

<a href="vote.html">
<span class="icon">🔥</span>
استكشف
</a>

<a href="create.html">
<span class="icon">➕</span>
إنشاء
</a>

<a href="vote.html">
<span class="icon">🏆</span>
الترتيب
</a>

<a
href="account.html"
class="active"
>
<span class="icon">👤</span>
حسابي
</a>

</nav>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://vatlwkuagxyrvwclttfz.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_7zlCZUTtFzvs_Ytv5XnvEg_y6tOWY94";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


/* ================================
   العناصر
================================ */

const loginBox =
document.getElementById("loginBox");

const profileContent =
document.getElementById("profileContent");

const avatar =
document.getElementById("avatar");

const nameElement =
document.getElementById("name");

const emailElement =
document.getElementById("email");

const googleBtn =
document.getElementById("googleBtn");

const logoutBtn =
document.getElementById("logoutBtn");


/* ================================
   تسجيل الدخول Google
================================ */

async function loginWithGoogle(){

  try{

    const {error} =
      await supabaseClient.auth.signInWithOAuth({

        provider:"google",

        options:{
          redirectTo:
          "https://akkarali86-cmyk.github.io/VOTERA/account.html"
        }

      });

    if(error){

      alert(
        "حدث خطأ:\n" +
        error.message
      );

    }

  }catch(error){

    console.error(error);

    alert(
      "حدث خطأ أثناء تسجيل الدخول."
    );

  }

}


/* ================================
   عرض الحساب
================================ */

function showUser(user){

  if(!user){

    loginBox.style.display =
      "block";

    profileContent.style.display =
      "none";

    return;

  }


  loginBox.style.display =
    "none";

  profileContent.style.display =
    "block";


  const userName =
    user.user_metadata?.full_name ||
    user.user_metadata?.name ||
    "مستخدم VOTERA";


  const userEmail =
    user.email ||
    "";


  const userAvatar =
    user.user_metadata?.avatar_url ||
    user.user_metadata?.picture ||
    "";


  nameElement.textContent =
    userName;

  emailElement.textContent =
    userEmail;


  if(userAvatar){

    avatar.src =
      userAvatar;

  }else{

    avatar.src =
      "https://ui-avatars.com/api/?name=" +
      encodeURIComponent(userName);

  }

}


/* ================================
   تسجيل الخروج
================================ */

async function logout(){

  const {error} =
    await supabaseClient.auth.signOut();

  if(error){

    alert(
      "حدث خطأ أثناء تسجيل الخروج."
    );

    return;

  }

  showUser(null);

}


/* ================================
   الأحداث
================================ */

googleBtn.addEventListener(
  "click",
  loginWithGoogle
);

logoutBtn.addEventListener(
  "click",
  logout
);


/* ================================
   فحص المستخدم
================================ */

async function checkUser(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient.auth.getSession();


  showUser(
    session
      ? session.user
      : null
  );

}


supabaseClient.auth.onAuthStateChange(
  function(event,session){

    showUser(
      session
        ? session.user
        : null
    );

  }
);


/* تشغيل */

checkUser();

</script>

</body>
</html>
