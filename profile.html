<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>الملف الشخصي — VOTERA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================
   VARIABLES
========================================= */

:root{
  --primary:#6c5ce7;
  --primary-dark:#5848d6;
  --bg:#f7f7fb;
  --card:#ffffff;
  --text:#17171c;
  --muted:#777783;
  --border:#e8e8ef;
}


/* =========================================
   RESET
========================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);

  /* مهم جدًا للقائمة السفلية */
  padding-bottom:100px;

  min-height:100vh;
}

button{
  font-family:inherit;
  border:0;
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =========================================
   HEADER
========================================= */

header{

  height:68px;

  background:rgba(255,255,255,.97);

  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;

  position:sticky;
  top:0;

  z-index:100;

}

.nav{

  width:100%;
  max-width:900px;

  margin:auto;

  padding:0 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

}

.logo{

  font-size:25px;

  font-weight:950;

  letter-spacing:-1px;

  direction:ltr;

}

.logo span{
  color:var(--primary);
}

.home-link{

  color:var(--muted);

  font-size:13px;

  font-weight:900;

}


/* =========================================
   CONTAINER
========================================= */

.container{

  width:100%;

  max-width:700px;

  margin:auto;

  padding:35px 18px 40px;

}


/* =========================================
   PROFILE HEADER
========================================= */

.profile-card{

  background:var(--card);

  border:1px solid var(--border);

  border-radius:24px;

  padding:28px 20px;

  text-align:center;

  box-shadow:
  0 8px 25px rgba(0,0,0,.035);

  margin-bottom:18px;

}

.avatar{

  width:82px;
  height:82px;

  border-radius:50%;

  background:#ece9ff;

  color:var(--primary);

  display:flex;

  align-items:center;
  justify-content:center;

  margin:0 auto 14px;

  font-size:35px;

  font-weight:950;

  overflow:hidden;

}

.avatar img{

  width:100%;
  height:100%;

  object-fit:cover;

}

.profile-name{

  font-size:22px;

  font-weight:950;

  margin-bottom:6px;

}

.profile-email{

  color:var(--muted);

  font-size:12px;

  direction:ltr;

  margin-bottom:20px;

}


/* =========================================
   STATS
========================================= */

.stats{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:8px;

}

.stat{

  background:#fafafd;

  border:1px solid var(--border);

  border-radius:15px;

  padding:13px 5px;

}

.stat strong{

  display:block;

  color:var(--primary);

  font-size:19px;

  margin-bottom:4px;

}

.stat span{

  color:var(--muted);

  font-size:10px;

  font-weight:800;

}


/* =========================================
   LOGIN
========================================= */

.login-card{

  background:white;

  border:1px solid var(--border);

  border-radius:22px;

  padding:30px 20px;

  text-align:center;

}

.login-card h2{

  font-size:21px;

  margin-bottom:10px;

}

.login-card p{

  color:var(--muted);

  font-size:13px;

  line-height:1.6;

  margin-bottom:18px;

}

.google-btn{

  background:white;

  border:1px solid var(--border);

  border-radius:13px;

  padding:13px 20px;

  font-weight:900;

}


/* =========================================
   SECTION TITLE
========================================= */

.section-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin:25px 2px 14px;

}

.section-header h2{

  font-size:21px;

  font-weight:950;

}

.section-header span{

  color:var(--primary);

  font-size:12px;

  font-weight:900;

}


/* =========================================
   VOTES
========================================= */

.votes{

  display:flex;

  flex-direction:column;

  gap:12px;

}

.vote-card{

  background:white;

  border:1px solid var(--border);

  border-radius:19px;

  padding:17px;

  box-shadow:
  0 5px 18px rgba(0,0,0,.025);

}

.vote-category{

  display:inline-block;

  background:#f0eeff;

  color:var(--primary);

  border-radius:20px;

  padding:6px 10px;

  font-size:10px;

  font-weight:900;

  margin-bottom:10px;

}

.vote-question{

  font-size:16px;

  font-weight:900;

  line-height:1.6;

  margin-bottom:12px;

}

.vote-date{

  color:var(--muted);

  font-size:10px;

}

.empty{

  background:white;

  border:1px solid var(--border);

  border-radius:20px;

  padding:30px 15px;

  text-align:center;

  color:var(--muted);

  font-size:13px;

}


/* =========================================
   LOGOUT
========================================= */

.logout{

  width:100%;

  margin-top:20px;

  padding:14px;

  border-radius:14px;

  background:#fff0f0;

  color:#d93025;

  font-size:14px;

  font-weight:950;

  border:1px solid #ffd5d5;

}

.logout:hover{

  background:#ffe4e4;

}


/* =========================================
   MESSAGE
========================================= */

.message{

  display:none;

  margin-bottom:15px;

  padding:13px;

  border-radius:13px;

  text-align:center;

  font-size:12px;

  font-weight:800;

}

.message.error{

  display:block;

  background:#fff0f0;

  color:#b42318;

}

.message.success{

  display:block;

  background:#ecfdf3;

  color:#166534;

}


/* =========================================
   BOTTOM NAVIGATION
   مهم جدًا
========================================= */

.bottom-nav{

  position:fixed;

  bottom:0;
  left:0;
  right:0;

  width:100%;

  height:76px;

  background:rgba(255,255,255,.98);

  border-top:1px solid var(--border);

  box-shadow:
  0 -6px 25px rgba(0,0,0,.07);

  display:flex;

  align-items:center;

  justify-content:center;

  z-index:9999;

}


/* محتوى القائمة */

.bottom-nav-inner{

  width:100%;

  max-width:600px;

  height:100%;

  display:grid;

  grid-template-columns:
  repeat(5,1fr);

  align-items:center;

}


/* عنصر القائمة */

.bottom-item{

  height:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:4px;

  background:transparent;

  color:#888895;

  font-size:10px;

  font-weight:900;

  transition:.2s;

}


/* الأيقونة */

.bottom-icon{

  font-size:21px;

  line-height:1;

}


/* النص */

.bottom-label{

  font-size:10px;

}


/* العنصر النشط */

.bottom-item.active{

  color:var(--primary);

}


/* زر الإضافة */

.bottom-create{

  width:52px;

  height:52px;

  border-radius:17px;

  background:var(--primary);

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:27px;

  box-shadow:
  0 8px 20px rgba(108,92,231,.30);

  margin-top:-20px;

}

.bottom-create:hover{

  background:var(--primary-dark);

}


/* =========================================
   DESKTOP
========================================= */

@media(min-width:700px){

  .container{

    padding-top:50px;

  }

  .bottom-nav{

    height:80px;

  }

  .bottom-nav-inner{

    max-width:650px;

  }

}


/* =========================================
   SMALL PHONES
========================================= */

@media(max-width:360px){

  .bottom-icon{

    font-size:19px;

  }

  .bottom-label{

    font-size:9px;

  }

  .bottom-create{

    width:48px;
    height:48px;

    font-size:24px;

  }

}

</style>

</head>


<body>

<!-- =====================================

<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://vatlwkuagxyrvwclttfz.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_7zlCZUTtFzvs_Ytv5XnvEg_y6tOWY94";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================
   VARIABLES
========================================= */

let currentUser = null;


/* =========================================
   ELEMENTS
========================================= */

const loginCard =
document.getElementById("loginCard");

const profileContent =
document.getElementById("profileContent");

const message =
document.getElementById("message");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

  message.textContent = text;

  message.className =
    "message " + type;

}


/* =========================================
   GOOGLE LOGIN
========================================= */

async function signInWithGoogle(){

  try{

    const {
      error
    } =
    await supabaseClient.auth.signInWithOAuth({

      provider:"google",

      options:{

        redirectTo:
        window.location.origin +
        "/VOTERA/profile.html"

      }

    });


    if(error){

      console.error(error);

      showMessage(
        "حدث خطأ أثناء تسجيل الدخول:\n" +
        error.message,
        "error"
      );

    }

  }catch(error){

    console.error(error);

    showMessage(
      "حدث خطأ أثناء الاتصال.",
      "error"
    );

  }

}


/* =========================================
   CHECK SESSION
========================================= */

async function checkUser(){

  try{

    const {
      data:{
        session
      }
    } =
    await supabaseClient.auth.getSession();


    currentUser =
      session?.user || null;


    if(currentUser){

      loginCard.style.display =
        "none";

      profileContent.style.display =
        "block";

      loadProfile();

    }else{

      loginCard.style.display =
        "block";

      profileContent.style.display =
        "none";

    }

  }catch(error){

    console.error(error);

    showMessage(
      "تعذر التحقق من تسجيل الدخول.",
      "error"
    );

  }

}


/* =========================================
   AUTH STATE
========================================= */

supabaseClient.auth.onAuthStateChange(
function(event,session){

  currentUser =
    session?.user || null;

  if(currentUser){

    loginCard.style.display =
      "none";

    profileContent.style.display =
      "block";

    loadProfile();

  }else{

    loginCard.style.display =
      "block";

    profileContent.style.display =
      "none";

  }

});


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(){

  if(!currentUser){

    return;

  }


  /* ---------------------------------------
     الاسم
  --------------------------------------- */

  const metadata =
    currentUser.user_metadata || {};


  const name =
    metadata.full_name ||
    metadata.name ||
    "مستخدم VOTERA";


  const email =
    currentUser.email ||
    "-";


  document.getElementById(
    "profileName"
  ).textContent =
    name;


  document.getElementById(
    "profileEmail"
  ).textContent =
    email;


  /* ---------------------------------------
     الصورة
  --------------------------------------- */

  const avatarUrl =
    metadata.avatar_url ||
    metadata.picture ||
    null;


  const avatar =
    document.getElementById("avatar");


  if(avatarUrl){

    avatar.innerHTML =
      `<img src="${avatarUrl}" alt="الصورة الشخصية">`;

  }else{

    avatar.textContent =
      "👤";

  }


  /* ---------------------------------------
     تاريخ التسجيل
  --------------------------------------- */

  if(currentUser.created_at){

    const date =
      new Date(
        currentUser.created_at
      );


    document.getElementById(
      "accountDate"
    ).textContent =
      date.toLocaleDateString(
        "ar-DZ",
        {
          month:"short",
          year:"numeric"
        }
      );

  }


  /* ---------------------------------------
     تحميل التصويتات
  --------------------------------------- */

  await loadMyVotes();

}


/* =========================================
   LOAD MY VOTES
========================================= */

async function loadMyVotes(){

  const votesList =
    document.getElementById(
      "votesList"
    );


  votesList.innerHTML =
    `
    <div class="empty">
      ⏳ جارٍ تحميل تصويتاتك...
    </div>
    `;


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("votes")
      .select("*")
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      console.error(error);

      throw error;

    }


    const votes =
      data || [];


    /* -------------------------------------
       العدد
    ------------------------------------- */

    document.getElementById(
      "votesCount"
    ).textContent =
      votes.length;


    document.getElementById(
      "votesTitleCount"
    ).textContent =
      votes.length +
      " تصويت";


    /* -------------------------------------
       لا توجد تصويتات
    ------------------------------------- */

    if(votes.length === 0){

      votesList.innerHTML =
        `
        <div class="empty">

          🗳️

          <br><br>

          لم تنشئ أي تصويت بعد.

          <br>

          ابدأ بإنشاء أول تصويت لك!

        </div>
        `;

      return;

    }


    /* -------------------------------------
       عرض التصويتات
    ------------------------------------- */

    votesList.innerHTML = "";


    let totalVotesNumber = 0;


    votes.forEach(
    function(vote){

      const total =
        Number(vote.votes_a || 0) +
        Number(vote.votes_b || 0) +
        Number(vote.votes_c || 0) +
        Number(vote.votes_d || 0) +
        Number(vote.votes_e || 0) +
        Number(vote.votes_f || 0) +
        Number(vote.votes_g || 0) +
        Number(vote.votes_h || 0) +
        Number(vote.votes_i || 0) +
        Number(vote.votes_j || 0) +
        Number(vote.votes_k || 0) +
        Number(vote.votes_l || 0) +
        Number(vote.votes_m || 0) +
        Number(vote.votes_n || 0) +
        Number(vote.votes_o || 0);


      totalVotesNumber += total;


      let dateText = "";


      if(vote.created_at){

        dateText =
          new Date(
            vote.created_at
          ).toLocaleDateString(
            "ar-DZ"
          );

      }


      const card =
        document.createElement("a");


      card.className =
        "vote-card";


      card.href =
        "vote.html?id=" +
        encodeURIComponent(
          vote.id
        );


      card.innerHTML = `

        <div class="vote-category">
          ${vote.category || "عام"}
        </div>

        <div class="vote-question">
          ${escapeHtml(
            vote.question || "تصويت بدون عنوان"
          )}
        </div>

        <div class="vote-date">
          🗳️ ${total} أصوات
          &nbsp;&nbsp; • &nbsp;&nbsp;
          📅 ${dateText}
        </div>

      `;


      votesList.appendChild(card);

    });


    document.getElementById(
      "totalVotes"
    ).textContent =
      totalVotesNumber;


  }catch(error){

    console.error(
      "Load votes error:",
      error
    );


    votesList.innerHTML =
      `
      <div class="empty">

        ❌ تعذر تحميل التصويتات.

        <br><br>

        ${escapeHtml(
          error.message || ""
        )}

      </div>
      `;

  }

}


/* =========================================
   SECURITY
========================================= */

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  const confirmed =
    confirm(
      "هل تريد تسجيل الخروج من VOTERA؟"
    );


  if(!confirmed){

    return;

  }


  try{

    const {
      error
    } =
    await supabaseClient.auth.signOut();


    if(error){

      throw error;

    }


    window.location.href =
      "index.html";


  }catch(error){

    console.error(error);

    showMessage(
      "تعذر تسجيل الخروج:\n" +
      error.message,
      "error"
    );

  }

}


/* =========================================
   START
========================================= */

checkUser();

</script>
