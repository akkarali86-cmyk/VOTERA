<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<style>

/* =========================================
   VARIABLES
========================================= */

:root{
  --primary:#6c5ce7;
  --primary-dark:#5848d6;
  --bg:#f7f7fb;
  --card:#ffffff;
  --text:#17171c;
  --muted:#777783;
  --border:#e8e8ef;
  --danger:#d93025;
  --success:#16a34a;
}


/* =========================================
   RESET
========================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  min-height:100%;
  background:var(--bg);
}

body{

  font-family:Arial,Helvetica,sans-serif;

  background:var(--bg);

  color:var(--text);

  min-height:100vh;

  padding-bottom:110px;

}

button,
input{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =========================================
   HEADER
========================================= */

header{

  height:68px;

  background:rgba(255,255,255,.98);

  border-bottom:1px solid var(--border);

  display:flex;

  align-items:center;

  position:sticky;

  top:0;

  z-index:100;

}

.nav{

  width:100%;

  max-width:900px;

  margin:auto;

  padding:0 18px;

  display:flex;

  align-items:center;

  justify-content:space-between;

}

.logo{

  font-size:25px;

  font-weight:950;

  letter-spacing:-1px;

  direction:ltr;

}

.logo span{
  color:var(--primary);
}

.home-link{

  color:var(--muted);

  font-size:13px;

  font-weight:900;

}


/* =========================================
   CONTAINER
========================================= */

.container{

  width:100%;

  max-width:700px;

  margin:auto;

  padding:35px 18px 30px;

}


/* =========================================
   MESSAGE
========================================= */

.message{

  display:none;

  margin-bottom:15px;

  padding:13px;

  border-radius:13px;

  text-align:center;

  font-size:12px;

  font-weight:800;

  white-space:pre-line;

}

.message.error{

  display:block;

  background:#fff0f0;

  color:#b42318;

  border:1px solid #ffd0d0;

}

.message.success{

  display:block;

  background:#ecfdf3;

  color:#166534;

  border:1px solid #bbf7d0;

}


/* =========================================
   LOGIN CARD
========================================= */

.login-card{

  background:white;

  border:1px solid var(--border);

  border-radius:22px;

  padding:30px 20px;

  text-align:center;

  box-shadow:
  0 8px 25px rgba(0,0,0,.035);

}

.login-card h2{

  font-size:21px;

  margin-bottom:10px;

}

.login-card p{

  color:var(--muted);

  font-size:13px;

  line-height:1.7;

  margin-bottom:18px;

}

.google-btn{

  background:white;

  border:1px solid var(--border);

  border-radius:13px;

  padding:13px 20px;

  font-weight:900;

  font-size:13px;

}


/* =========================================
   PROFILE CARD
========================================= */

.profile-card{

  background:var(--card);

  border:1px solid var(--border);

  border-radius:24px;

  padding:28px 20px;

  text-align:center;

  box-shadow:
  0 8px 25px rgba(0,0,0,.035);

  margin-bottom:18px;

}

.avatar{

  width:92px;

  height:92px;

  border-radius:50%;

  background:#ece9ff;

  color:var(--primary);

  display:flex;

  align-items:center;

  justify-content:center;

  margin:0 auto 14px;

  font-size:38px;

  font-weight:950;

  overflow:hidden;

  border:3px solid #f0eeff;

}

.avatar img{

  width:100%;

  height:100%;

  object-fit:cover;

}

.profile-name{

  font-size:22px;

  font-weight:950;

  margin-bottom:5px;

}

.profile-username{

  color:var(--primary);

  direction:ltr;

  font-size:13px;

  font-weight:900;

  margin-bottom:10px;

}

.profile-email{

  color:var(--muted);

  font-size:12px;

  direction:ltr;

  margin-bottom:12px;

}

.profile-bio{

  color:#555560;

  font-size:13px;

  line-height:1.7;

  margin:0 auto 15px;

  max-width:500px;

}

.profile-age{

  display:inline-block;

  background:#f5f3ff;

  color:var(--primary);

  border-radius:20px;

  padding:6px 11px;

  font-size:11px;

  font-weight:900;

  margin-bottom:16px;

}


/* =========================================
   FOLLOW BUTTON
========================================= */

.follow-button{

  width:100%;

  max-width:280px;

  padding:13px 20px;

  border-radius:13px;

  background:var(--primary);

  color:white;

  font-size:13px;

  font-weight:950;

  margin:0 auto 18px;

  display:block;

  transition:.2s;

}

.follow-button:hover{

  background:var(--primary-dark);

}

.follow-button:disabled{

  opacity:.65;

  cursor:not-allowed;

}

.follow-button.following{

  background:#f0eeff;

  color:var(--primary);

  border:1px solid #dcd6ff;

}

.follow-button.following:hover{

  background:#ffecec;

  color:var(--danger);

  border-color:#ffd0d0;

}


/* =========================================
   FOLLOW STATS
========================================= */

.follow-stats{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-bottom:8px;

}

.follow-stat{

  background:#fafafd;

  border:1px solid var(--border);

  border-radius:15px;

  padding:13px 5px;

}

.follow-stat strong{

  display:block;

  color:var(--primary);

  font-size:19px;

  margin-bottom:4px;

}

.follow-stat span{

  color:var(--muted);

  font-size:10px;

  font-weight:800;

}


/* =========================================
   PROFILE STATS
========================================= */

.stats{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:8px;

  margin-top:8px;

}

.stat{

  background:#fafafd;

  border:1px solid var(--border);

  border-radius:15px;

  padding:13px 5px;

}

.stat strong{

  display:block;

  color:var(--primary);

  font-size:19px;

  margin-bottom:4px;

}

.stat span{

  color:var(--muted);

  font-size:10px;

  font-weight:800;

}


/* =========================================
   SECTION HEADER
========================================= */

.section-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin:25px 2px 14px;

}

.section-header h2{

  font-size:21px;

  font-weight:950;

}

.section-header span{

  color:var(--primary);

  font-size:12px;

  font-weight:900;

}


/* =========================================
   VOTES
========================================= */

.votes{

  display:flex;

  flex-direction:column;

  gap:12px;

}

.vote-card{

  display:block;

  background:white;

  border:1px solid var(--border);

  border-radius:19px;

  padding:17px;

  box-shadow:
  0 5px 18px rgba(0,0,0,.025);

  transition:.2s;

}

.vote-card:hover{

  border-color:#d4cffd;

  transform:translateY(-1px);

}

.vote-card:active{

  transform:scale(.98);

}

.vote-category{

  display:inline-block;

  background:#f0eeff;

  color:var(--primary);

  border-radius:20px;

  padding:6px 10px;

  font-size:10px;

  font-weight:900;

  margin-bottom:10px;

}

.vote-question{

  font-size:16px;

  font-weight:900;

  line-height:1.6;

  margin-bottom:12px;

}

.vote-date{

  color:var(--muted);

  font-size:10px;

}

.empty{

  background:white;

  border:1px solid var(--border);

  border-radius:20px;

  padding:30px 15px;

  text-align:center;

  color:var(--muted);

  font-size:13px;

  line-height:1.7;

}


/* =========================================
   LOGOUT
========================================= */

.logout{

  width:100%;

  margin-top:20px;

  padding:14px;

  border-radius:14px;

  background:#fff0f0;

  color:var(--danger);

  font-size:14px;

  font-weight:950;

  border:1px solid #ffd5d5;

}


/* =========================================
   BOTTOM NAVIGATION
========================================= */

.bottom-nav{

  position:fixed !important;

  left:0 !important;

  right:0 !important;

  bottom:0 !important;

  width:100% !important;

  height:82px !important;

  display:block !important;

  background:#ffffff !important;

  border-top:1px solid #e8e8ef !important;

  box-shadow:
  0 -6px 25px rgba(0,0,0,.10) !important;

  z-index:2147483647 !important;

}

.bottom-nav-inner{

  width:100%;

  max-width:650px;

  height:100%;

  margin:auto;

  display:grid;

  grid-template-columns:repeat(5,1fr);

  align-items:center;

}

.bottom-item{

  height:82px;

  display:flex !important;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:5px;

  background:transparent;

  color:#858592;

  font-size:10px;

  font-weight:900;

  position:relative;

  -webkit-tap-highlight-color:transparent;

}

.bottom-item.active{

}

.bottom-icon{

  width:28px;

  height:28px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:21px;

}

.bottom-label{

  font-size:10px;

  white-space:nowrap;

}

.bottom-create{

  width:52px;

  height:52px;

  border-radius:17px;

  background:var(--primary);

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:28px;

  margin-top:-22px;

  box-shadow:
  0 8px 22px rgba(108,92,231,.32);

}

.bottom-create:active{

  transform:scale(.94);

}


/* =========================================
   SAFE AREA
========================================= */

@supports(padding-bottom:env(safe-area-inset-bottom)){

  .bottom-nav{

    height:
    calc(82px + env(safe-area-inset-bottom))
    !important;

    padding-bottom:
    env(safe-area-inset-bottom);

  }

  body{

    padding-bottom:
    calc(110px + env(safe-area-inset-bottom));

  }

}


/* =========================================
   SMALL PHONES
========================================= */

@media(max-width:360px){

  .bottom-icon{

    font-size:19px;

  }

  .bottom-label{

    font-size:9px;

  }

  .bottom-create{

    width:47px;

    height:47px;

    font-size:25px;

  }

}

</style>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://vatlwkuagxyrvwclttfz.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_7zlCZUTtFzvs_Ytv5XnvEg_y6tOWY94";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================
   VARIABLES
========================================= */

let currentUser = null;

let profileUserId = null;

let profileData = null;

let isFollowing = false;


/* =========================================
   ELEMENTS
========================================= */

const loginCard =
document.getElementById("loginCard");

const profileContent =
document.getElementById("profileContent");

const message =
document.getElementById("message");

const followButton =
document.getElementById("followButton");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

  message.textContent =
    text;

  message.className =
    "message " + type;

}


/* =========================================
   GOOGLE LOGIN
========================================= */

async function signInWithGoogle(){

  try{

    const {
      error
    } =
    await supabaseClient.auth.signInWithOAuth({

      provider:"google",

      options:{

        redirectTo:
          window.location.href

      }

    });


    if(error){

      console.error(error);

      showMessage(
        "حدث خطأ أثناء تسجيل الدخول:\n" +
        error.message,
        "error"
      );

    }

  }catch(error){

    console.error(error);

    showMessage(
      "حدث خطأ أثناء الاتصال.",
      "error"
    );

  }

}


/* =========================================
   GET PROFILE ID
========================================= */

function getProfileIdFromUrl(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("id");

}


/* =========================================
   CHECK USER
========================================= */

async function checkUser(){

  try{

    const {
      data:{
        session
      }
    } =
    await supabaseClient.auth.getSession();


    currentUser =
      session?.user || null;


    /*
      إذا كان هناك id في الرابط
      نفتح ملف ذلك المستخدم.

      إذا لم يوجد id:
      نفتح ملف المستخدم الحالي.
    */

    const urlProfileId =
      getProfileIdFromUrl();


    if(urlProfileId){

      profileUserId =
        urlProfileId;

    }else if(currentUser){

      profileUserId =
        currentUser.id;

    }else{

      profileUserId =
        null;

    }


    await updatePage();


  }catch(error){

    console.error(
      "Check user error:",
      error
    );

    showMessage(
      "تعذر تحميل الصفحة:\n" +
      error.message,
      "error"
    );

  }

}


/* =========================================
   UPDATE PAGE
========================================= */

async function updatePage(){

  const bottomNav =
    document.getElementById(
      "bottomNav"
    );


  if(bottomNav){

    bottomNav.style.display =
      "block";

    bottomNav.style.visibility =
      "visible";

    bottomNav.style.opacity =
      "1";

  }


  /*
    لا يوجد مستخدم مسجل
    ولا يوجد id في الرابط
  */

  if(!profileUserId){

    loginCard.style.display =
      "block";

    profileContent.style.display =
      "none";

    return;

  }


  /*
    لدينا profileUserId،
    لذلك يمكن عرض الملف حتى
    لو لم يكن الزائر مسجلًا.
  */

  loginCard.style.display =
    "none";

  profileContent.style.display =
    "block";


  await loadProfile();


}


/* =========================================
   LOAD PROFILE FROM DATABASE
========================================= */

async function loadProfile(){

  if(!profileUserId){

    return;

  }


  try{

    /*
      نحصل على بيانات صاحب الملف
      من جدول profiles
    */

    const {
      data,
      error
    } =
    await supabaseClient
      .from("profiles")
      .select(`
        id,
        username,
        display_name,
        avatar_url,
        bio,
        points,
        created_at,
        age
      `)
      .eq(
        "id",
        profileUserId
      )
      .maybeSingle();


    if(error){

      throw error;

    }


    if(!data){

      profileContent.style.display =
        "none";

      showMessage(
        "لم يتم العثور على هذا الملف الشخصي.",
        "error"
      );

      return;

    }


    profileData =
      data;


    /*
      الاسم
    */

    const displayName =
      data.display_name ||
      data.username ||
      "مستخدم VOTERA";


    document.getElementById(
      "profileName"
    ).textContent =
      displayName;


    /*
      اسم المستخدم
    */

    const username =
      data.username ||
      "";


    document.getElementById(
      "profileUsername"
    ).textContent =
      username
      ? "@" + username
      : "";


    document.getElementById(
      "profileUsernameStat"
    ).textContent =
      username
      ? "@" + username
      : "-";


    /*
      النبذة
    */

    const bioElement =
      document.getElementById(
        "profileBio"
      );


    if(data.bio){

      bioElement.textContent =
        data.bio;

      bioElement.style.display =
        "block";

    }else{

      bioElement.style.display =
        "none";

    }


    /*
      العمر
    */

    const ageElement =
      document.getElementById(
        "profileAge"
      );


    if(data.age){

      ageElement.textContent =
        "🎂 " +
        data.age +
        " سنة";

      ageElement.style.display =
        "inline-block";

      document.getElementById(
        "ageCount"
      ).textContent =
        data.age;

    }else{

      ageElement.style.display =
        "none";

      document.getElementById(
        "ageCount"
      ).textContent =
        "-";

    }


    /*
      النقاط
    */

    document.getElementById(
      "pointsCount"
    ).textContent =
      Number(data.points || 0);


    /*
      تاريخ إنشاء الحساب
    */

    if(data.created_at){

      const date =
        new Date(
          data.created_at
        );


      document.getElementById(
        "accountDate"
      ).textContent =
        date.toLocaleDateString(
          "ar-DZ",
          {
            month:"short",
            year:"numeric"
          }
        );

    }else{

      document.getElementById(
        "accountDate"
      ).textContent =
        "-";

    }


    /*
      الصورة الشخصية
    */

    const avatar =
      document.getElementById(
        "avatar"
      );


    avatar.innerHTML =
      "👤";


    if(data.avatar_url){

      const img =
        document.createElement("img");

      img.src =
        data.avatar_url;

      img.alt =
        "الصورة الشخصية";

      img.onerror =
      function(){

        avatar.innerHTML =
          "👤";

      };


      avatar.innerHTML =
        "";

      avatar.appendChild(
        img
      );

    }


    /*
      هل الملف الحالي هو ملف المستخدم نفسه؟
    */

    if(
      currentUser &&
      currentUser.id === profileUserId
    ){

      followButton.style.display =
        "none";

      document.getElementById(
        "logoutButton"
      ).style.display =
        "block";

    }else{

      /*
        عند زيارة ملف شخص آخر
      */

      document.getElementById(
        "logoutButton"
      ).style.display =
        currentUser
        ? "block"
        : "none";


      followButton.style.display =
        "block";


      if(currentUser){

        await checkFollowStatus();

      }else{

        isFollowing =
          false;

        updateFollowButton();

      }

    }


    /*
      إحصائيات المتابعة
    */

    await loadFollowStats();


    /*
      تصويتات المستخدم
    */

    await loadUserVotes();


  }catch(error){

    console.error(
      "Load profile error:",
      error
    );


    profileContent.style.display =
      "none";


    showMessage(
      "تعذر تحميل الملف الشخصي:\n" +
      error.message,
      "error"
    );

  }

}


/* =========================================
   CHECK FOLLOW STATUS
========================================= */

async function checkFollowStatus(){

  if(
    !currentUser ||
    !profileUserId ||
    currentUser.id === profileUserId
  ){

    return;

  }


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("follows")
      .select("id")
      .eq(
        "follower_id",
        currentUser.id
      )
      .eq(
        "following_id",
        profileUserId
      )
      .maybeSingle();


    if(error){

      console.error(
        "Check follow error:",
        error
      );

      return;

    }


    isFollowing =
      !!data;


    updateFollowButton();


  }catch(error){

    console.error(error);

  }

}


/* =========================================
   UPDATE FOLLOW BUTTON
========================================= */

function updateFollowButton(){

  if(!followButton){

    return;

  }


  if(isFollowing){

    followButton.classList.add(
      "following"
    );

    followButton.textContent =
      "✓ متابَع";

    followButton.title =
      "اضغط لإلغاء المتابعة";

  }else{

    followButton.classList.remove(
      "following"
    );

    followButton.textContent =
      "➕ متابعة";

    followButton.title =
      "متابعة هذا المستخدم";

  }

}


/* =========================================
   TOGGLE FOLLOW
========================================= */

async function toggleFollow(){

  /*
    يجب تسجيل الدخول
  */

  if(!currentUser){

    showMessage(
      "يجب تسجيل الدخول أولًا حتى تتمكن من متابعة المستخدمين.",
      "error"
    );

    return;

  }


  if(!profileUserId){

    return;

  }


  /*
    لا يمكن متابعة نفسك
  */

  if(
    currentUser.id ===
    profileUserId
  ){

    return;

  }


  followButton.disabled =
    true;


  try{

    /*
      إلغاء المتابعة
    */

    if(isFollowing){

      const {
        error
      } =
      await supabaseClient
        .from("follows")
        .delete()
        .eq(
          "follower_id",
          currentUser.id
        )
        .eq(
          "following_id",
          profileUserId
        );


      if(error){

        throw error;

      }


      isFollowing =
        false;


      showMessage(
        "تم إلغاء المتابعة.",
        "success"
      );


    }else{

      /*
        متابعة المستخدم
      */

      const {
        error
      } =
      await supabaseClient
        .from("follows")
        .insert({

          follower_id:
            currentUser.id,

          following_id:
            profileUserId

        });


      if(error){

        /*
          23505 = موجود مسبقًا
        */

        if(
          error.code === "23505"
        ){

          isFollowing =
            true;

        }else{

          throw error;

        }

      }else{

        isFollowing =
          true;

      }


      showMessage(
        "تمت المتابعة بنجاح! 🎉",
        "success"
      );

    }


    updateFollowButton();


    /*
      تحديث عدد المتابعين
    */

    await loadFollowStats();


  }catch(error){

    console.error(
      "Toggle follow error:",
      error
    );


    showMessage(
      "تعذر تنفيذ العملية:\n" +
      error.message,
      "error"
    );

  }


  followButton.disabled =
    false;

}


/* =========================================
   FOLLOW STATS
========================================= */

async function loadFollowStats(){

  if(!profileUserId){

    return;

  }


  try{

    /*
      عدد المتابعين
    */

    const {
      count:followers,
      error:followersError
    } =
    await supabaseClient
      .from("follows")
      .select(
        "*",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "following_id",
        profileUserId
      );


    if(followersError){

      throw followersError;

    }


    /*
      عدد الأشخاص الذين يتابعهم
    */

    const {
      count:following,
      error:followingError
    } =
    await supabaseClient
      .from("follows")
      .select(
        "*",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "follower_id",
        profileUserId
      );


    if(followingError){

      throw followingError;

    }


    document.getElementById(
      "followersCount"
    ).textContent =
      followers || 0;


    document.getElementById(
      "followingCount"
    ).textContent =
      following || 0;


  }catch(error){

    console.error(
      "Follow stats error:",
      error
    );

  }

}


/* =========================================
   VOTE OPTIONS
========================================= */

function getVoteOptions(vote){

  if(!vote){

    return [];

  }


  let options =
    vote.options;


  if(typeof options === "string"){

    try{

      options =
        JSON.parse(options);

    }catch(error){

      return [];

    }

  }


  if(!Array.isArray(options)){

    return [];

  }


  return options;

}


/* =========================================
   CALCULATE VOTE TOTAL
========================================= */

function calculateVoteTotal(vote){

  /*
    النظام الجديد:
    options = array
  */

  const options =
    getVoteOptions(vote);


  if(options.length){

    let total =
      0;


    options.forEach(
    function(option){

      if(!option){

        return;

      }


      total +=
        Number(
          option.votes || 0
        );

    });


    return total;

  }


  /*
    دعم النظام القديم
    إذا كانت الأصوات مخزنة
    في votes_a ... votes_o
  */

  let total =
    0;


  const letters =
    [
      "a","b","c","d","e",
      "f","g","h","i","j",
      "k","l","m","n","o"
    ];


  letters.forEach(
  function(letter){

    total +=
      Number(
        vote["votes_" + letter] || 0
      );

  });


  return total;

}


/* =========================================
   LOAD USER VOTES
========================================= */

async function loadUserVotes(){

  const votesList =
    document.getElementById(
      "votesList"
    );


  votesList.innerHTML = `

    <div class="empty">

      ⏳ جارٍ تحميل التصويتات...

    </div>

  `;


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("votes")
      .select("*")
      .eq(
        "user_id",
        profileUserId
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      throw error;

    }


    const votes =
      data || [];


    document.getElementById(
      "votesCount"
    ).textContent =
      votes.length;


    document.getElementById(
      "votesTitleCount"
    ).textContent =
      votes.length +
      " تصويت";


    if(votes.length === 0){

      document.getElementById(
        "totalVotes"
      ).textContent =
        "0";


      votesList.innerHTML = `

        <div class="empty">

          🗳️

          <br><br>

          لا توجد تصويتات بعد.

        </div>

      `;

      return;

    }


    votesList.innerHTML =
      "";


    let totalVotesNumber =
      0;


    votes.forEach(
    function(vote){

      const total =
        calculateVoteTotal(
          vote
        );


      totalVotesNumber +=
        total;


      let dateText =
        "";


      if(vote.created_at){

        dateText =
          new Date(
            vote.created_at
          ).toLocaleDateString(
            "ar-DZ"
          );

      }


      const card =
        document.createElement("a");


      card.className =
        "vote-card";


      card.href =
        "vote.html?id=" +
        encodeURIComponent(
          vote.id
        );


      const category =
        escapeHtml(
          vote.category ||
          "عام"
        );


      const question =
        escapeHtml(
          vote.question ||
          "تصويت بدون عنوان"
        );


      card.innerHTML = `

        <div class="vote-category">

          ${category}

        </div>


        <div class="vote-question">

          ${question}

        </div>


        <div class="vote-date">

          🗳️ ${total} أصوات

          &nbsp;&nbsp; • &nbsp;&nbsp;

          📅 ${dateText}

        </div>

      `;


      votesList.appendChild(
        card
      );

    });


    document.getElementById(
      "totalVotes"
    ).textContent =
      totalVotesNumber;


  }catch(error){

    console.error(
      "Load votes error:",
      error
    );


    votesList.innerHTML = `

      <div class="empty">

        ❌ تعذر تحميل التصويتات.

        <br><br>

        ${escapeHtml(
          error.message || ""
        )}

      </div>

    `;

  }

}


/* =========================================
   SECURITY
========================================= */

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(text);


  return div.innerHTML;

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  const confirmed =
    confirm(
      "هل تريد تسجيل الخروج من VOTERA؟"
    );


  if(!confirmed){

    return;

  }


  try{

    const {
      error
    } =
    await supabaseClient.auth.signOut();


    if(error){

      throw error;

    }


    window.location.href =
      "index.html";


  }catch(error){

    console.error(
      "Logout error:",
      error
    );


    showMessage(
      "تعذر تسجيل الخروج:\n" +
      error.message,
      "error"
    );

  }

}
