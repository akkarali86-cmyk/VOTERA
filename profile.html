<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الملف الشخصي — VOTERA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --primary:#6c5ce7;
  --primary-dark:#5848d6;
  --bg:#f7f7fb;
  --card:#ffffff;
  --text:#17171c;
  --muted:#777783;
  --border:#e8e8ef;
  --danger:#d93025;
  --success:#16a34a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  min-height:100%;
  background:var(--bg);
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:110px;
}

button,input{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}


/* HEADER */

header{
  height:68px;
  background:rgba(255,255,255,.98);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
}

.nav{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:950;
  letter-spacing:-1px;
  direction:ltr;
}

.logo span{
  color:var(--primary);
}

.home-link{
  color:var(--muted);
  font-size:13px;
  font-weight:900;
}


/* CONTAINER */

.container{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:35px 18px 30px;
}


/* MESSAGE */

.message{
  display:none;
  margin-bottom:15px;
  padding:13px;
  border-radius:13px;
  text-align:center;
  font-size:12px;
  font-weight:800;
  white-space:pre-line;
}

.message.error{
  display:block;
  background:#fff0f0;
  color:#b42318;
  border:1px solid #ffd0d0;
}

.message.success{
  display:block;
  background:#ecfdf3;
  color:#166534;
  border:1px solid #bbf7d0;
}


/* LOGIN */

.login-card{
  background:white;
  border:1px solid var(--border);
  border-radius:22px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,.035);
}

.login-card h2{
  font-size:21px;
  margin-bottom:10px;
}

.login-card p{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
  margin-bottom:18px;
}

.google-btn{
  background:white;
  border:1px solid var(--border);
  border-radius:13px;
  padding:13px 20px;
  font-weight:900;
  font-size:13px;
}


/* PROFILE CARD */

.profile-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:28px 20px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,.035);
  margin-bottom:18px;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#ece9ff;
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 14px;
  font-size:35px;
  font-weight:950;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-username{
  color:var(--primary);
  font-size:13px;
  font-weight:900;
  direction:ltr;
  margin-bottom:5px;
}

.profile-name{
  font-size:22px;
  font-weight:950;
  margin-bottom:7px;
}

.profile-email{
  color:var(--muted);
  font-size:12px;
  direction:ltr;
  margin-bottom:12px;
}

.profile-bio{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
  margin:0 auto 18px;
  max-width:500px;
}


/* FOLLOW */

.follow-button{
  width:100%;
  max-width:260px;
  padding:13px 20px;
  border-radius:13px;
  background:var(--primary);
  color:white;
  font-size:13px;
  font-weight:950;
  margin:0 auto 18px;
  display:block;
  transition:.2s;
}

.follow-button:hover{
  background:var(--primary-dark);
}

.follow-button.following{
  background:#f0eeff;
  color:var(--primary);
  border:1px solid #dcd6ff;
}

.follow-button.following:hover{
  background:#fff0f0;
  color:var(--danger);
  border-color:#ffd0d0;
}

.follow-button:disabled{
  opacity:.6;
  cursor:not-allowed;
}


/* FOLLOW STATS */

.follow-stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:8px;
}

.follow-stat{
  background:#fafafd;
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px 5px;
}

.follow-stat strong{
  display:block;
  color:var(--primary);
  font-size:19px;
  margin-bottom:4px;
}

.follow-stat span{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}


/* USER INFO */

.user-info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:8px;
}

.info-box{
  background:#fafafd;
  border:1px solid var(--border);
  border-radius:15px;
  padding:12px 6px;
}

.info-box strong{
  display:block;
  color:var(--primary);
  font-size:17px;
  margin-bottom:4px;
}

.info-box span{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}


/* VOTE STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.stat{
  background:#fafafd;
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px 5px;
}

.stat strong{
  display:block;
  color:var(--primary);
  font-size:19px;
  margin-bottom:4px;
}

.stat span{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}


/* SECTION */

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 2px 14px;
}

.section-header h2{
  font-size:21px;
  font-weight:950;
}

.section-header span{
  color:var(--primary);
  font-size:12px;
  font-weight:900;
}


/* VOTES */

.votes{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.vote-card{
  display:block;
  background:white;
  border:1px solid var(--border);
  border-radius:19px;
  padding:17px;
  box-shadow:0 5px 18px rgba(0,0,0,.025);
  transition:.2s;
}

.vote-card:hover{
  border-color:#d4cffd;
  transform:translateY(-1px);
}

.vote-card:active{
  transform:scale(.98);
}

.vote-category{
  display:inline-block;
  background:#f0eeff;
  color:var(--primary);
  border-radius:20px;
  padding:6px 10px;
  font-size:10px;
  font-weight:900;
  margin-bottom:10px;
}

.vote-question{
  font-size:16px;
  font-weight:900;
  line-height:1.6;
  margin-bottom:12px;
}

.vote-date{
  color:var(--muted);
  font-size:10px;
}

.empty{
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  padding:30px 15px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}


/* LOGOUT */

.logout{
  width:100%;
  margin-top:20px;
  padding:14px;
  border-radius:14px;
  background:#fff0f0;
  color:var(--danger);
  font-size:14px;
  font-weight:950;
  border:1px solid #ffd5d5;
}


/* BOTTOM NAV */

.bottom-nav{
  position:fixed !important;
  left:0 !important;
  right:0 !important;
  bottom:0 !important;
  width:100% !important;
  height:82px !important;
  display:block !important;
  background:#fff !important;
  border-top:1px solid #e8e8ef !important;
  box-shadow:0 -6px 25px rgba(0,0,0,.10) !important;
  z-index:2147483647 !important;
}

.bottom-nav-inner{
  width:100%;
  max-width:650px;
  height:100%;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  align-items:center;
}

.bottom-item{
  height:82px;
  display:flex !important;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  background:transparent;
  color:#858592;
  font-size:10px;
  font-weight:900;
  position:relative;
}

.bottom-item.active{
  color:var(--primary);
}

.bottom-icon{
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.bottom-label{
  font-size:10px;
  white-space:nowrap;
}

.bottom-create{
  width:52px;
  height:52px;
  border-radius:17px;
  background:var(--primary);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  margin-top:-22px;
  box-shadow:0 8px 22px rgba(108,92,231,.32);
}


/* MOBILE */

@media(max-width:360px){

  .bottom-icon{
    font-size:19px;
  }

  .bottom-label{
    font-size:9px;
  }

  .bottom-create{
    width:47px;
    height:47px;
    font-size:25px;
  }

  .profile-name{
    font-size:20px;
  }

}

</style>
</head>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://vatlwkuagxyrvwclttfz.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_7zlCZUTtFzvs_Ytv5XnvEg_y6tOWY94";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================
   VARIABLES
========================================= */

let currentUser = null;
let profileUserId = null;
let profileData = null;
let isFollowing = false;


/* =========================================
   ELEMENTS
========================================= */

const loginCard =
document.getElementById("loginCard");

const profileContent =
document.getElementById("profileContent");

const message =
document.getElementById("message");

const followButton =
document.getElementById("followButton");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

  message.textContent = text;

  message.className =
    "message " + type;

}


/* =========================================
   GOOGLE LOGIN
========================================= */

async function signInWithGoogle(){

  try{

    const { error } =
      await supabaseClient.auth.signInWithOAuth({

        provider:"google",

        options:{
          redirectTo:
            window.location.origin +
            "/VOTERA/profile.html"
        }

      });


    if(error){

      console.error(error);

      showMessage(
        "حدث خطأ أثناء تسجيل الدخول:\n" +
        error.message,
        "error"
      );

    }

  }catch(error){

    console.error(error);

    showMessage(
      "حدث خطأ أثناء الاتصال.",
      "error"
    );

  }

}


/* =========================================
   GET PROFILE ID
========================================= */

function getProfileIdFromUrl(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("id");

}


/* =========================================
   CHECK USER
========================================= */

async function checkUser(){

  try{

    const { data, error } =
      await supabaseClient.auth.getSession();


    if(error){

      throw error;

    }


    currentUser =
      data.session?.user || null;


    const urlProfileId =
      getProfileIdFromUrl();


    /*
      إذا كان هناك id في الرابط
      نستخدمه.

      إذا لم يوجد id:
      نفتح ملف المستخدم الحالي.
    */

    if(urlProfileId){

      profileUserId =
        urlProfileId;

    }else if(currentUser){

      profileUserId =
        currentUser.id;

    }else{

      profileUserId =
        null;

    }


    updatePage();

  }catch(error){

    console.error(error);

    showMessage(
      "تعذر التحقق من تسجيل الدخول.",
      "error"
    );

  }

}


/* =========================================
   UPDATE PAGE
========================================= */

function updatePage(){

  const bottomNav =
    document.getElementById("bottomNav");


  if(bottomNav){

    bottomNav.style.display = "block";

    bottomNav.style.visibility = "visible";

    bottomNav.style.opacity = "1";

  }


  /*
    إذا لم يكن هناك مستخدم
    والصفحة ليست مرتبطة بملف عام،
    نطلب تسجيل الدخول.
  */

  if(!currentUser && !profileUserId){

    loginCard.style.display =
      "block";

    profileContent.style.display =
      "none";

    return;

  }


  /*
    إذا كان المستخدم غير مسجل
    ولكن لديه رابط ملف شخص آخر،
    نسمح بعرض الملف.
  */

  loginCard.style.display =
    "none";

  profileContent.style.display =
    "block";


  loadProfile();

}


/* =========================================
   AUTH STATE
========================================= */

supabaseClient.auth.onAuthStateChange(
function(event,session){

  currentUser =
    session?.user || null;


  /*
    إذا لم يوجد id في الرابط
    نستخدم المستخدم الحالي.
  */

  if(
    !getProfileIdFromUrl() &&
    currentUser
  ){

    profileUserId =
      currentUser.id;

  }


  setTimeout(
    function(){

      updatePage();

    },
    0
  );

});


/* =========================================
   LOAD PROFILE FROM PROFAILes
========================================= */

async function loadProfile(){

  if(!profileUserId){

    return;

  }


  try{

    /*
      جلب بطاقة المستخدم
      من جدول Profailes
    */

    const {
      data,
      error
    } =
    await supabaseClient
      .from("Profailes")
      .select("*")
      .eq(
        "id",
        profileUserId
      )
      .maybeSingle();


    if(error){

      throw error;

    }


    if(!data){

      profileContent.innerHTML = `

        <div class="empty">

          ❌ لم يتم العثور على هذا الملف الشخصي.

          <br><br>

          ربما الرابط غير صحيح.

        </div>

      `;

      return;

    }


    profileData =
      data;


    renderProfile();


  }catch(error){

    console.error(
      "Load profile error:",
      error
    );


    showMessage(
      "تعذر تحميل الملف الشخصي:\n" +
      error.message,
      "error"
    );

  }

}


/* =========================================
   RENDER PROFILE
========================================= */

function renderProfile(){

  if(!profileData){

    return;

  }


  const username =
    profileData.username ||
    "username";


  const displayName =
    profileData.display_name ||
    username ||
    "مستخدم VOTERA";


  const bio =
    profileData.bio ||
    "لا توجد نبذة بعد.";


  const points =
    Number(
      profileData.points || 0
    );


  const age =
    profileData.age ||
    "-";


  document.getElementById(
    "profileUsername"
  ).textContent =
    "@" + username;


  document.getElementById(
    "profileName"
  ).textContent =
    displayName;


  document.getElementById(
    "profileBio"
  ).textContent =
    bio;


  document.getElementById(
    "pointsCount"
  ).textContent =
    points;


  document.getElementById(
    "ageValue"
  ).textContent =
    age;


  document.getElementById(
    "votesOwnerName"
  ).textContent =
    displayName;


  /*
    البريد الإلكتروني يظهر فقط
    عندما يكون الملف للمستخدم الحالي.
  */

  if(
    currentUser &&
    profileUserId === currentUser.id
  ){

    document.getElementById(
      "profileEmail"
    ).textContent =
      currentUser.email || "-";

    document.getElementById(
      "logoutButton"
    ).style.display =
      "block";

  }else{

    document.getElementById(
      "profileEmail"
    ).textContent =
      "";

    document.getElementById(
      "logoutButton"
    ).style.display =
      "none";

  }


  /*
    الصورة
  */

  const avatar =
    document.getElementById("avatar");


  const avatarUrl =
    profileData.avatar_url ||
    null;


  avatar.innerHTML =
    "";


  if(avatarUrl){

    const img =
      document.createElement("img");


    img.src =
      avatarUrl;


    img.alt =
      "الصورة الشخصية";


    img.onerror =
    function(){

      avatar.innerHTML =
        "👤";

    };


    avatar.appendChild(img);

  }else{

    avatar.textContent =
      "👤";

  }


  /*
    تاريخ الإنشاء
  */

  if(profileData.created_at){

    const date =
      new Date(
        profileData.created_at
      );


    document.getElementById(
      "accountDate"
    ).textContent =
      date.toLocaleDateString(
        "ar-DZ",
        {
          month:"short",
          year:"numeric"
        }
      );

  }else{

    document.getElementById(
      "accountDate"
    ).textContent =
      "-";

  }


  /*
    زر المتابعة
  */

  if(
    currentUser &&
    profileUserId !== currentUser.id
  ){

    followButton.style.display =
      "block";

    checkFollowStatus();

  }else{

    followButton.style.display =
      "none";

  }


  loadFollowStats();

  loadMyVotes();

}


/* =========================================
   CHECK FOLLOW STATUS
========================================= */

async function checkFollowStatus(){

  if(
    !currentUser ||
    !profileUserId ||
    currentUser.id === profileUserId
  ){

    return;

  }


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("follows")
      .select("id")
      .eq(
        "follower_id",
        currentUser.id
      )
      .eq(
        "following_id",
        profileUserId
      )
      .maybeSingle();


    if(error){

      console.error(
        "Check follow error:",
        error
      );

      return;

    }


    isFollowing =
      !!data;


    updateFollowButton();


  }catch(error){

    console.error(error);

  }

}


/* =========================================
   FOLLOW BUTTON
========================================= */

function updateFollowButton(){

  if(!followButton){

    return;

  }


  if(isFollowing){

    followButton.classList.add(
      "following"
    );

    followButton.textContent =
      "✓ متابَع";

    followButton.title =
      "اضغط لإلغاء المتابعة";

  }else{

    followButton.classList.remove(
      "following"
    );

    followButton.textContent =
      "➕ متابعة";

    followButton.title =
      "متابعة المستخدم";

  }

}


/* =========================================
   TOGGLE FOLLOW
========================================= */

async function toggleFollow(){

  if(!currentUser){

    showMessage(
      "يجب تسجيل الدخول أولًا حتى تتمكن من متابعة المستخدمين.",
      "error"
    );

    return;

  }


  if(!profileUserId){

    return;

  }


  if(currentUser.id === profileUserId){

    return;

  }


  followButton.disabled =
    true;


  try{

    if(isFollowing){

      /*
        إلغاء المتابعة
      */

      const {
        error
      } =
      await supabaseClient
        .from("follows")
        .delete()
        .eq(
          "follower_id",
          currentUser.id
        )
        .eq(
          "following_id",
          profileUserId
        );


      if(error){

        throw error;

      }


      isFollowing =
        false;


      showMessage(
        "تم إلغاء المتابعة.",
        "success"
      );


    }else{

      /*
        متابعة
      */

      const {
        error
      } =
      await supabaseClient
        .from("follows")
        .insert({

          follower_id:
            currentUser.id,

          following_id:
            profileUserId

        });


      if(error){

        /*
          إذا كان يتابع بالفعل
        */

        if(
          error.code === "23505"
        ){

          isFollowing =
            true;

        }else{

          throw error;

        }

      }else{

        isFollowing =
          true;

      }


      showMessage(
        "تمت المتابعة بنجاح! 🎉",
        "success"
      );

    }


    updateFollowButton();

    await loadFollowStats();


  }catch(error){

    console.error(
      "Toggle follow error:",
      error
    );


    showMessage(
      "تعذر تنفيذ المتابعة:\n" +
      error.message,
      "error"
    );

  }


  followButton.disabled =
    false;

}


/* =========================================
   FOLLOW STATS
========================================= */

async function loadFollowStats(){

  if(!profileUserId){

    return;

  }


  try{

    /*
      المتابعون
    */

    const {
      count:followers,
      error:followersError
    } =
    await supabaseClient
      .from("follows")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "following_id",
        profileUserId
      );


    if(followersError){

      throw followersError;

    }


    /*
      الأشخاص الذين يتابعهم المستخدم
    */

    const {
      count:following,
      error:followingError
    } =
    await supabaseClient
      .from("follows")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "follower_id",
        profileUserId
      );


    if(followingError){

      throw followingError;

    }


    document.getElementById(
      "followersCount"
    ).textContent =
      followers || 0;


    document.getElementById(
      "followingCount"
    ).textContent =
      following || 0;


  }catch(error){

    console.error(
      "Follow stats error:",
      error
    );

  }

}


/* =========================================
   GET VOTE OPTIONS
========================================= */

function getVoteOptions(vote){

  if(!vote){

    return [];

  }


  let options =
    vote.options;


  if(typeof options === "string"){

    try{

      options =
        JSON.parse(options);

    }catch(error){

      return [];

    }

  }


  if(!Array.isArray(options)){

    return [];

  }


  return options;

}


/* =========================================
   CALCULATE VOTES
========================================= */

function calculateVoteTotal(vote){

  /*
    الطريقة الجديدة:
    options = [
      { text:"...", votes:10 },
      { text:"...", votes:5 }
    ]
  */

  const options =
    getVoteOptions(vote);


  if(options.length > 0){

    let total = 0;


    options.forEach(
      function(option){

        if(!option){

          return;

        }


        total +=
          Number(
            option.votes || 0
          );

      }
    );


    return total;

  }


  /*
    دعم النظام القديم
  */

  const oldColumns = [

    "votes_a",
    "votes_b",
    "votes_c",
    "votes_d",
    "votes_e",
    "votes_f",
    "votes_g",
    "votes_h",
    "votes_i",
    "votes_j",
    "votes_k",
    "votes_l",
    "votes_m",
    "votes_n",
    "votes_o"

  ];


  let total = 0;


  oldColumns.forEach(
    function(column){

      total +=
        Number(
          vote[column] || 0
        );

    }
  );


  return total;

}


/* =========================================
   LOAD USER VOTES
========================================= */

async function loadMyVotes(){

  const votesList =
    document.getElementById(
      "votesList"
    );


  votesList.innerHTML = `

    <div class="empty">

      ⏳ جارٍ تحميل التصويتات...

    </div>

  `;


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("votes")
      .select("*")
      .eq(
        "user_id",
        profileUserId
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      throw error;

    }


    const votes =
      data || [];


    document.getElementById(
      "votesCount"
    ).textContent =
      votes.length;


    document.getElementById(
      "votesTitleCount"
    ).textContent =
      votes.length +
      " تصويت";


    if(votes.length === 0){

      document.getElementById(
        "totalVotes"
      ).textContent =
        "0";


      votesList.innerHTML = `

        <div class="empty">

          🗳️

          <br><br>

          لا توجد تصويتات بعد.

        </div>

      `;

      return;

    }


    votesList.innerHTML =
      "";


    let totalVotesNumber =
      0;


    votes.forEach(
      function(vote){

        const total =
          calculateVoteTotal(vote);


        totalVotesNumber +=
          total;


        let dateText =
          "";


        if(vote.created_at){

          dateText =
            new Date(
              vote.created_at
            ).toLocaleDateString(
              "ar-DZ"
            );

        }


        const card =
          document.createElement("a");


        card.className =
          "vote-card";


        card.href =
          "vote.html?id=" +
          encodeURIComponent(
            vote.id
          );


        const category =
          escapeHtml(
            vote.category ||
            "عام"
          );


        const question =
          escapeHtml(
            vote.question ||
            "تصويت بدون عنوان"
          );


        card.innerHTML = `

          <div class="vote-category">

            ${category}

          </div>


          <div class="vote-question">

            ${question}

          </div>


          <div class="vote-date">

            🗳️ ${total} أصوات

            &nbsp;&nbsp; • &nbsp;&nbsp;

            📅 ${dateText}

          </div>

        `;


        votesList.appendChild(
          card
        );

      }
    );


    document.getElementById(
      "totalVotes"
    ).textContent =
      totalVotesNumber;


  }catch(error){

    console.error(
      "Load votes error:",
      error
    );


    votesList.innerHTML = `

      <div class="empty">

        ❌ تعذر تحميل التصويتات.

        <br><br>

        ${escapeHtml(
          error.message || ""
        )}

      </div>

    `;

  }

}


/* =========================================
   SECURITY
========================================= */

function escapeHtml(text){

  const div =
    document.createElement("div");


  div.textContent =
    String(text);


  return div.innerHTML;

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  const confirmed =
    confirm(
      "هل تريد تسجيل الخروج من VOTERA؟"
    );


  if(!confirmed){

    return;

  }


  try{

    const {
      error
    } =
    await supabaseClient.auth.signOut();


    if(error){

      throw error;

    }


    window.location.href =
      "index.html";


  }catch(error){

    console.error(error);

    showMessage(
      "تعذر تسجيل الخروج:\n" +
      error.message,
      "error"
    );

  }

}
